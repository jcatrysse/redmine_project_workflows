# Digests of Redmine core's own body for every method this plugin shadows,
# measured per supported Redmine minor. Generated, then checked in on purpose.
#
# WHY (finding F03). The plugin reimplements these rather than extending them:
# core's queries carry no project_id predicate, so there is no `super` to fall
# through to without breaching INV-4. When core changes one of these bodies,
# nothing notices -- the plugin's own specs assert the plugin's expected answers,
# not core's, so they stay green. That has already happened twice to
# Issue#new_statuses_allowed_to, both times semantically; 5.0 -> 5.1 replaced
# `user.admin ? Role.all : user.roles_for_project(project)` with
# `roles_for_workflow(user)`, adding a consider_workflow? filter. Carrying the
# 5.0 copy onto 5.1 would silently have offered transitions for roles that take
# no part in a workflow.
#
# HOW TO UPDATE. A red example here means core changed a body the plugin has
# copied, on the host under test. That is not a failure to silence -- it is the
# one moment somebody should read core's new version against the plugin's. Then:
#
#   1. read the diff, and decide whether the plugin's copy must follow;
#   2. change the copy if it must, with a test;
#   3. only then update the digest below, in the same commit.
#
# Updating the digest first is the one thing that makes this file worse than
# having no file. The spec prints the method, the host and both digests, and the
# body itself is at core's own source_location.
#
# A Redmine minor with no entry here is REPORTED, not failed: an unknown host is
# a fact about coverage, and failing there would mean the plugin could not be
# tried on a new Redmine at all -- which is what narrowing requires_redmine would
# have done, and the whole reason this file exists instead.
#
# The digests are QUOTED. A SHA256 that happens to be all digits is parsed as an
# Integer otherwise, and the comparison then fails against every host for a
# reason that has nothing to do with core -- found while probing this gate with a
# deliberately wrong all-zero digest.
#
# Measured on 5.1-stable, 6.1-stable and 7.0-stable + PostgreSQL 16.
# 6.1 and 7.0 are IDENTICAL on all nineteen; 5.1 differs in exactly four, the
# three controller actions and Project#copy, which matches what F03 measured
# across five branches.
#
# Project#copy is the nineteenth, and it is a DELEGATE rather than a copy: the
# plugin's version remembers whether the copy form's workflow checkbox was
# ticked and calls super. It is here because the digest reports the copies *and*
# the delegates, and rightly: if core ever changes how it reads options[:only],
# or moves the model_project_copy_before_save hook out of that method, the
# checkbox would silently stop being honoured. 5.1's body differs from 6.1's and
# 7.0's in one character -- `send "copy_#{name}"` against `send :"copy_#{name}"`
# -- which changes nothing the plugin depends on.
