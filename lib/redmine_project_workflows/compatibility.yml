# The compatibility manifest (ADR-002). Every version fact this plugin holds is
# here, and RedmineProjectWorkflows::Compatibility is the only thing that reads
# it: VersionHelper, the drift spec, the conventions spec, the diagnostics page
# and the README's Compatibility section all go through that module.
#
# It absorbed spec/upstream/core_method_digests.yml on 2026-08-28. That file was
# a test fixture, and half of what it knew -- which Redmine minors have been
# measured -- is a fact the *running plugin* needs in order to tell an
# administrator that their Redmine is one nobody has tried this on.
#
# ---------------------------------------------------------------------------
# THE DIGESTS, AND HOW TO UPDATE THEM
# ---------------------------------------------------------------------------
#
# Digests of Redmine core's own body for every method this plugin shadows or
# depends on, measured per verified Redmine minor.
#
# WHY (finding F03). The plugin reimplements these rather than extending them:
# core's queries carry no project_id predicate, so there is no `super` to fall
# through to without breaching INV-4. When core changes one of these bodies,
# nothing notices -- the plugin's own specs assert the plugin's expected answers,
# not core's, so they stay green. That has already happened twice to
# Issue#new_statuses_allowed_to, both times semantically; 5.0 -> 5.1 replaced
# `user.admin ? Role.all : user.roles_for_project(project)` with
# `roles_for_workflow(user)`, adding a consider_workflow? filter. Carrying the
# 5.0 copy onto 5.1 would silently have offered transitions for roles that take
# no part in a workflow.
#
# HOW TO UPDATE. A red example in spec/upstream/core_drift_spec.rb means core
# changed a body the plugin has copied, on the host under test. That is not a
# failure to silence -- it is the one moment somebody should read core's new
# version against the plugin's. Then:
#
#   1. read the diff, and decide whether the plugin's copy must follow;
#   2. change the copy if it must, with a test;
#   3. only then update the digest below, in the same commit.
#
# Updating the digest first is the one thing that makes this file worse than
# having no file. The spec prints the method, the host and both digests, and the
# body itself is at core's own source_location.
#
# The digests are QUOTED. A SHA256 that happens to be all digits is parsed as an
# Integer otherwise, and the comparison then fails against every host for a
# reason that has nothing to do with core -- found while probing this gate with a
# deliberately wrong all-zero digest.
#
# ---------------------------------------------------------------------------
# ADDING A MINOR
# ---------------------------------------------------------------------------
#
# A Redmine minor with no entry here is what ADR-002 calls *unverified*: the
# plugin boots, works, and says so -- in the log and on the diagnostics page --
# and measures the digests below against the newest entry to report whether
# anything it copied has actually changed. CI is stricter than runtime and
# fails on an unverified minor, which is the point: "we test three minors" and
# "we boot on all of them" are different claims and used to drift apart.
#
# To add one: build a host (dev/setup.sh), run the suite, read the drift the
# spec reports, and paste the measured digests in. `Compatibility.host_minor`
# names the key, and dev/measure_compatibility.rb prints the block.
---
# Redmine 6.0 introduced IconsHelper#sprite_icon and app/assets/images/icons.svg
# and stopped shipping pictures behind the `icon icon-add` CSS classes. Asked as
# a version rather than as `respond_to?(:sprite_icon)`, which two neighbouring
# plugins answer for core on 5.1 (finding F02 of
# 2026-08-28-claude-plugin-compat-5.1.md).
sprite_icons_from: '6.0'

# The three the CI matrix runs against every verified minor. Nine cells.
databases:
  - PostgreSQL
  - MySQL
  - MariaDB

# Core methods the plugin CALLS but does not shadow. A shadowed method has
# core's own definition one step up the chain, so `super_method` finds it and a
# digest covers it. These have neither: they are reached with `send` because
# core makes them private, and nothing but this list would notice one being
# renamed away. The digest gate reads this and gives each an entry of its own.
dependencies:
  'Issue#roles_for_workflow': >-
    Private in core. TransitionQuery, PermissionQuery and TransitionMapQuery all
    call it to get the roles a user's workflow is resolved from; it is also what
    the plugin's copy of Issue#new_statuses_allowed_to calls. Core introduced it
    at 5.1, replacing `user.admin ? Role.all.to_a : user.roles_for_project`, and
    that change added the consider_workflow? filter -- which is the same method
    changing semantically once already. If it goes, every issue save raises.

# The verified Redmine minors: the ones a nine-cell CI matrix runs the whole
# suite against on every push, and the ones the digests below were measured on.
#
# Ruby and Rails are the host's own, recorded rather than required: they are what
# the plugin has been run against, and .rubocop.yml's TargetRailsVersion must
# stay no newer than the OLDEST of them or the lint gate approves code the 5.1
# cell cannot run.
#
# Measured on 5.1-stable, 6.1-stable and 7.0-stable + PostgreSQL 16, through
# dev/measure_compatibility.rb.
#
# 5.1 differs from 6.1 in four: Project#copy and three of WorkflowsController's
# actions (permissions, update, update_permissions). 6.1 and 7.0 differ in
# exactly one, and it is one the gate could not see until 2026-08-28:
# WorkflowTransition.replace_transitions, which 7.0 rewrote to index the
# existing records by [old status, new status, tracker, role] instead of
# scanning them per cell. Read against 6.1's body it is the same rules with a
# hash in front of them -- and the plugin replaces that method outright rather
# than copying it, so nothing followed. Recorded here because "no change was
# needed" is a conclusion somebody reached by reading, not a gap.
#
# Project#copy is a DELEGATE rather than a copy: the plugin's version remembers
# whether the copy form's workflow checkbox was ticked and calls super. It is
# here because the digest reports the copies *and* the delegates, and rightly:
# if core ever changes how it reads options[:only], or moves the
# model_project_copy_before_save hook out of that method, the checkbox would
# silently stop being honoured. 5.1's body differs from 6.1's in one character
# -- `send "copy_#{name}"` against `send :"copy_#{name}"` -- which changes
# nothing the plugin depends on.
