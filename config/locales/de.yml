de:
  label_project_workflows_global: Allgemein
  error_workflow_copy_source_project: Bitte wählen Sie einen Quell-Tracker, eine Rolle und ein Projekt aus.
  error_workflow_copy_target: Bitte wählen Sie Ziel-Tracker, Rollen und Projekte aus.
  error_workflow_copy_target_project: Ein oder mehrere ausgewählte Zielprojekte existieren nicht.
  error_workflow_copy_target_tracker_or_role: Ein oder mehrere ausgewählte Ziel-Tracker oder -Rollen existieren nicht.
  label_project_workflow_scope: Workflow für die ausgewählten Projekte
  label_project_workflow_state_inherits: "Folgt dem allgemeinen Workflow"
  label_project_workflow_state_own: Eigener Workflow
  label_project_workflow_state_own_empty: Eigener leerer Workflow
  label_project_workflow_count_own:
    one: "%{count} eigener Workflow"
    other: "%{count} eigene Workflows"
  label_project_workflow_count_own_empty:
    one: "%{count} eigener leerer Workflow"
    other: "%{count} eigene leere Workflows"
  label_project_workflow_count_inherits:
    one: "%{count} folgt dem allgemeinen Workflow"
    other: "%{count} folgen dem allgemeinen Workflow"
  button_project_workflow_enable_copy: Eigenen Workflow geben (Kopie des allgemeinen)
  button_project_workflow_enable_empty: Eigenen leeren Workflow geben
  button_project_workflow_clear: Diesen Workflow leeren
  button_project_workflow_inherit: Zurück zum allgemeinen Workflow
  text_project_workflow_scope_help: Ein eigener Workflow ersetzt den allgemeinen; er wird ihm nie hinzugefügt. Ein eigener leerer Workflow erlaubt nichts.
  text_project_workflow_enable_copy_confirm: Diesem Projekt einen eigenen Workflow geben, als Kopie des allgemeinen? Dies betrifft %{count} Kombination(en) aus Projekt, Tracker und Rolle.
  text_project_workflow_enable_empty_confirm: Diesem Projekt einen eigenen, leeren Workflow geben? Bis Sie Regeln hinzufügen, ist nichts erlaubt. Dies betrifft %{count} Kombination(en) aus Projekt, Tracker und Rolle.
  text_project_workflow_clear_confirm: Alle Regeln aus diesem Workflow entfernen? Das Projekt behält seinen eigenen Workflow, dieser erlaubt dann aber nichts.
  text_project_workflow_inherit_confirm: Zurück zum allgemeinen Workflow? Die eigenen Regeln des Projekts werden gelöscht.
  notice_project_workflow_enabled_copy:
    one: "%{count} Workflow vom allgemeinen kopiert."
    other: "%{count} Workflows vom allgemeinen kopiert."
  notice_project_workflow_enabled_empty:
    one: "%{count} eigener leerer Workflow angelegt."
    other: "%{count} eigene leere Workflows angelegt."
  notice_project_workflow_inherited:
    one: "%{count} Workflow auf den allgemeinen zurückgesetzt."
    other: "%{count} Workflows auf den allgemeinen zurückgesetzt."
  notice_project_workflow_emptied:
    one: "%{count} Workflow geleert."
    other: "%{count} Workflows geleert."
  notice_project_workflow_scope_unchanged: Es musste nichts geändert werden.
  label_project_workflow_inventory: Workflow-Übersicht
  label_project_workflow_rule_type: Art der Regel
  label_project_workflow_inventory_deviations_only: Nur Projekte mit eigenem Workflow
  text_project_workflow_inventory_description: "Eine Zeile je Projekt, Tracker und Rolle. Die Zahl gibt an, wie viele Regeln das Projekt selbst hat; die Beschriftung sagt, ob diese Regeln gelten oder der allgemeine Workflow."
  text_project_workflow_inventory_empty: Kein Projekt hat für diese Auswahl einen eigenen Workflow.
  text_project_workflow_inventory_empty_filtered: Keine Kombination aus Projekt, Tracker und Rolle entspricht dieser Auswahl.
  button_project_workflow_inventory_show_all: Jedes Projekt, jeden Tracker und jede Rolle anzeigen
  button_project_workflow_inventory_open_matrices: Workflow-Matrizen öffnen
  error_project_workflow_inventory_filter: Ein oder mehrere Filterwerte existieren nicht mehr und wurden ignoriert.
  permission_view_project_workflow: Workflow des Projekts ansehen
  permission_manage_project_workflow: Workflow des Projekts verwalten
  label_project_workflow_project_scope: Workflow dieses Projekts
  label_project_workflow_open_matrix: Diesen Workflow öffnen
  text_project_workflow_tab_description: Eine Zeile je Tracker und Rolle, über die dieses Projekt entscheiden kann. Die Zahl gibt an, wie viele Regeln das Projekt selbst hat; die Beschriftung sagt, ob diese Regeln gelten oder der allgemeine Workflow.
  text_project_workflow_tab_nothing_to_configure: "Hier gibt es noch nichts einzustellen: dieses Projekt hat keinen Tracker aktiviert oder keine Rolle mit Mitgliedern, die an einem Workflow teilnimmt."
  text_project_workflow_project_enable_copy_confirm: Diesem Projekt einen eigenen Workflow für diesen Tracker und diese Rolle geben, beginnend als Kopie des allgemeinen?
  text_project_workflow_project_enable_empty_confirm: Diesem Projekt einen eigenen, leeren Workflow für diesen Tracker und diese Rolle geben? Es ist nichts erlaubt, bis Sie Regeln hinzufügen.
  text_project_workflow_readonly_generic: "Dieses Projekt folgt dem allgemeinen Workflow für diesen Tracker und diese Rolle. Er wird unten als Referenz gezeigt; geben Sie dem Projekt einen eigenen Workflow, um ihn zu ändern."
  text_project_workflow_readonly_own: Dies ist der eigene Workflow des Projekts. Um ihn zu ändern, benötigen Sie das Recht, den Workflow dieses Projekts zu verwalten.
  notice_project_workflow_not_own: "Dieses Projekt folgt dem allgemeinen Workflow für diesen Tracker und diese Rolle, daher wurde nichts gespeichert. Geben Sie dem Projekt zuerst einen eigenen Workflow."
  notice_project_workflow_save_nothing_applied: "Es wurde nichts gespeichert. Entweder wurde keine Zelle geändert, oder die übermittelten Werte wurden nicht akzeptiert."
  notice_project_workflow_copy_left_empty:
    one: "%{count} Kombination aus Projekt, Tracker und Rolle hat jetzt einen eigenen leeren Workflow: die Kopie hat dort keine Regeln dieser Art hinterlassen. Dort ist nichts erlaubt, bis Sie Regeln hinzufügen."
    other: "%{count} Kombinationen aus Projekt, Tracker und Rolle haben jetzt einen eigenen leeren Workflow: die Kopie hat dort keine Regeln dieser Art hinterlassen. Dort ist nichts erlaubt, bis Sie Regeln hinzufügen."
  text_project_workflow_scope_inheriting_note:
    one: "%{count} Kombination in dieser Auswahl folgt noch dem allgemeinen Workflow. Die Matrix unten zeigt nur die Regeln, die die Auswahl selbst speichert; diese Kombination erscheint daher leer, und Speichern ändert nichts daran — geben Sie ihr zuerst einen eigenen Workflow."
    other: "%{count} Kombinationen in dieser Auswahl folgen noch dem allgemeinen Workflow. Die Matrix unten zeigt nur die Regeln, die die Auswahl selbst speichert; diese Kombinationen erscheinen daher leer, und Speichern ändert nichts daran — geben Sie ihnen zuerst einen eigenen Workflow."
  notice_project_workflow_save_skipped_inheriting:
    one: "%{count} Kombination aus Projekt, Tracker und Rolle folgt noch dem allgemeinen Workflow und wurde nicht geändert. Geben Sie ihr zuerst einen eigenen Workflow."
    other: "%{count} Kombinationen aus Projekt, Tracker und Rolle folgen noch dem allgemeinen Workflow und wurden nicht geändert. Geben Sie ihnen zuerst einen eigenen Workflow."
  label_project_workflow_bulk_row: 'Ganze Zeile "%{name}" auf %{value} setzen'
  label_project_workflow_bulk_column: 'Ganze Spalte "%{name}" auf %{value} setzen'
  text_project_workflow_bulk_confirm: 'Diese Aktion betrifft %{count} Workflow-Regel(n). Fortfahren?'
  text_project_workflow_bulk_selection: 'Eine Zelle dieser Matrix steht für %{count} Workflow(s): %{trackers} Tracker × %{roles} Rolle(n) × %{scopes} Workflow-Bereich(e).'
  text_project_workflow_bulk_legend: '"%{no_change}" bedeutet, dass die Workflows, für die eine Zelle steht, nicht alle dasselbe sagen; beim Speichern bleibt jeder davon unverändert.'
  text_project_workflow_bulk_legend_actions: 'Eine Zeilen- oder Spaltenaktion mit "%{no_change}" setzt jede Zelle dieser Zeile oder Spalte auf den Wert zurück, mit dem die Seite geöffnet wurde.'
  label_project_workflow_bulk_confirm_threshold: 'Bestätigung verlangen, wenn eine Zeilen- oder Spaltenaktion mehr ändert als'
  text_project_workflow_bulk_confirm_threshold: 'Anzahl der Workflow-Regeln. Eine Zeilen- oder Spaltenaktion, die mehr als dies ändern würde, fragt zuerst nach einer Bestätigung. 0 fragt immer.'
  label_project_workflow_compare: Mit dem allgemeinen Workflow vergleichen
  label_project_workflow_compare_difference: Unterschied
  label_project_workflow_compare_project_only: Nur in diesem Projekt
  label_project_workflow_compare_generic_only: Nur im allgemeinen Workflow
  label_project_workflow_compare_changed: Unterschiedlich
  label_project_workflow_compare_condition: Gilt für
  label_project_workflow_compare_in_project: In diesem Projekt
  label_project_workflow_compare_in_generic: Im allgemeinen Workflow
  label_project_workflow_condition_always: Alle mit dieser Rolle
  label_project_workflow_condition_author: Auch wenn der Benutzer der Autor ist
  label_project_workflow_condition_assignee: Auch wenn der Benutzer der Bearbeiter ist
  text_project_workflow_compare_description: Der Workflow dieses Projekts ersetzt den allgemeinen Workflow für diesen Tracker und diese Rolle; das Folgende ist also der vollständige Unterschied. Es wird nichts zusammengeführt und es gilt nichts mehr aus dem allgemeinen Workflow.
  text_project_workflow_compare_counts: Dieses Projekt hat %{project} eigene Regel(n) für diesen Tracker und diese Rolle; der allgemeine Workflow hat %{generic}.
  text_project_workflow_compare_identical: Der eigene Workflow dieses Projekts ist für diesen Tracker und diese Rolle mit dem allgemeinen identisch.
  text_project_workflow_compare_inherits: "Dieses Projekt folgt dem allgemeinen Workflow für diesen Tracker und diese Rolle, es gibt also nichts zu vergleichen."
  button_project_workflow_bulk_undo: Rückgängig
  text_project_workflow_bulk_changed: '%{cells} Zelle(n) geändert, %{rules} Workflow-Regel(n).'
  text_project_workflow_bulk_undone: 'Rückgängig gemacht: %{cells} Zelle(n) zurückgesetzt.'
  text_project_workflow_bulk_unsaved: Es wurde noch nichts gespeichert. Klicken Sie auf Speichern, um die Änderungen zu übernehmen.
  label_project_workflow_comparison: Workflow-Vergleich
  text_project_workflow_compare_unreachable_field: Mindestens ein Unterschied unten betrifft ein Feld, das dieser Tracker nicht mehr anbietet; die eigene Matrix des Projekts kann es daher nicht anzeigen oder ändern. Ein Systemadministrator kann eine solche Regel über die Administration entfernen.
  label_project_workflow_map: Workflow für dieses Ticket
  label_project_workflow_map_scope: Welcher Workflow gilt
  label_project_workflow_map_from_here: Von hier erlaubte Statuswechsel
  label_project_workflow_map_leads_here: Status, die zu diesem führen
  label_project_workflow_map_available: Jetzt verfügbar
  text_project_workflow_map_authority: Dies ist, was der Workflow erlaubt. Maßgeblich für das, was Sie in diesem Moment tun dürfen, bleibt die Statusliste im Formular; jeder Unterschied zwischen beiden wird unten erklärt.
  text_project_workflow_map_no_outgoing: Dieser Workflow erlaubt von hier aus keinen Statuswechsel.
  text_project_workflow_map_no_incoming: Dieser Workflow erlaubt keinen Statuswechsel zu diesem Status.
  text_project_workflow_map_no_roles: Sie haben in diesem Projekt keine Rolle, die an einem Workflow teilnimmt, daher ist kein Statuswechsel erlaubt.
  text_project_workflow_map_own_empty: Dieses Projekt hat für diesen Tracker und diese Rolle einen eigenen Workflow, und dieser enthält keine einzige Regel, daher ist kein Statuswechsel erlaubt. Das ist eine bewusste Einstellung und kein Fehler.
  text_project_workflow_map_requires_author: Nur der Autor des Tickets darf diese Änderung vornehmen.
  text_project_workflow_map_requires_assignee: Nur der Bearbeiter des Tickets darf diese Änderung vornehmen.
  text_project_workflow_map_requires_author_or_assignee: Nur der Autor oder der Bearbeiter des Tickets darf diese Änderung vornehmen.
  text_project_workflow_map_unavailable: Für dieses Ticket derzeit nicht verfügbar.
  label_project_workflow_map_condition_author: Nur wenn der Benutzer der Autor ist
  label_project_workflow_map_condition_assignee: Nur wenn der Benutzer der Bearbeiter ist
  label_project_workflow_map_condition_author_or_assignee: Nur wenn der Benutzer der Autor oder der Bearbeiter ist
