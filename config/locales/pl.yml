pl:
  label_project_workflows_global: Ogólny
  error_workflow_copy_source_project: Wybierz źródłowy typ zagadnienia, rolę i projekt.
  error_workflow_copy_target: Wybierz docelowe typy zagadnień, role i projekty.
  error_workflow_copy_target_project: Co najmniej jeden z wybranych projektów docelowych nie istnieje.
  error_workflow_copy_target_tracker_or_role: Co najmniej jeden z wybranych docelowych typów zagadnień lub ról nie istnieje.
  label_project_workflow_scope: Przepływ pracy dla wybranych projektów
  label_project_workflow_state_inherits: "Stosuje ogólny przepływ pracy"
  label_project_workflow_state_own: Własny przepływ pracy
  label_project_workflow_state_own_empty: Własny pusty przepływ pracy
  # Redmine's I18n applies only the one/other forms to Polish, so the plural
  # entries put the number after the noun: "wlasne przeplywy pracy: 3" reads
  # correctly for every count, where "3 przeplywow pracy" does not.
  label_project_workflow_count_own:
    one: "%{count} własny przepływ pracy"
    other: "własne przepływy pracy: %{count}"
  label_project_workflow_count_own_empty:
    one: "%{count} własny pusty przepływ pracy"
    other: "własne puste przepływy pracy: %{count}"
  label_project_workflow_count_inherits:
    one: "%{count} stosuje ogólny przepływ pracy"
    other: "stosuje ogólny przepływ pracy: %{count}"
  button_project_workflow_enable_copy: Nadaj własny przepływ pracy (kopia ogólnego)
  button_project_workflow_enable_empty: Nadaj własny pusty przepływ pracy
  button_project_workflow_clear: Opróżnij ten przepływ pracy
  button_project_workflow_inherit: Wróć do ogólnego przepływu pracy
  text_project_workflow_scope_help: Własny przepływ pracy zastępuje ogólny; nigdy się do niego nie dodaje. Własny pusty przepływ pracy nie pozwala na nic.
  text_project_workflow_enable_copy_confirm: "Nadać temu projektowi własny przepływ pracy, zaczynając od kopii ogólnego? Liczba objętych kombinacji projektu, typu zagadnienia i roli: %{count}."
  text_project_workflow_enable_empty_confirm: "Nadać temu projektowi własny, pusty przepływ pracy? Nic nie będzie dozwolone, dopóki nie dodasz reguł. Liczba objętych kombinacji projektu, typu zagadnienia i roli: %{count}."
  text_project_workflow_clear_confirm: Usunąć wszystkie reguły z tego przepływu pracy? Projekt zachowa własny przepływ pracy, ale nie będzie on pozwalał na nic.
  text_project_workflow_inherit_confirm: Wrócić do ogólnego przepływu pracy? Własne reguły projektu zostaną usunięte.
  notice_project_workflow_enabled_copy:
    one: "Skopiowano %{count} przepływ pracy z ogólnego."
    other: "Liczba przepływów pracy skopiowanych z ogólnego: %{count}."
  notice_project_workflow_enabled_empty:
    one: "Utworzono %{count} własny pusty przepływ pracy."
    other: "Liczba utworzonych własnych pustych przepływów pracy: %{count}."
  notice_project_workflow_inherited:
    one: "Przywrócono %{count} przepływ pracy do ogólnego."
    other: "Liczba przepływów pracy przywróconych do ogólnego: %{count}."
  notice_project_workflow_emptied:
    one: "Opróżniono %{count} przepływ pracy."
    other: "Liczba opróżnionych przepływów pracy: %{count}."
  notice_project_workflow_scope_unchanged: Nie było nic do zmiany.
  label_project_workflow_inventory: Zestawienie przepływów pracy
  label_project_workflow_rule_type: Rodzaj reguły
  label_project_workflow_inventory_deviations_only: Tylko projekty z własnym przepływem pracy
  text_project_workflow_inventory_description: "Jeden wiersz na projekt, typ zagadnienia i rolę. Liczba oznacza, ile reguł ma sam projekt; etykieta mówi, czy obowiązują te reguły, czy ogólny przepływ pracy."
  text_project_workflow_inventory_empty: Żaden projekt nie ma własnego przepływu pracy dla tego wyboru.
  text_project_workflow_inventory_empty_filtered: Żadne połączenie projektu, typu zagadnienia i roli nie pasuje do tego wyboru.
  button_project_workflow_inventory_show_all: Pokaż każdy projekt, typ zagadnienia i rolę
  button_project_workflow_inventory_open_matrices: Otwórz macierze przepływu pracy
  error_project_workflow_inventory_filter: Co najmniej jedna wartość filtra już nie istnieje i została pominięta.
  permission_view_project_workflow: Podgląd przepływu pracy projektu
  permission_manage_project_workflow: Zarządzanie przepływem pracy projektu
  label_project_workflow_project_scope: Przepływ pracy tego projektu
  label_project_workflow_open_matrix: Otwórz ten przepływ pracy
  text_project_workflow_tab_description: Jeden wiersz na typ zagadnienia i rolę, o których ten projekt może decydować. Liczba oznacza, ile reguł ma sam projekt; etykieta mówi, czy obowiązują te reguły, czy ogólny przepływ pracy.
  text_project_workflow_tab_nothing_to_configure: "Nie ma tu jeszcze nic do ustawienia: ten projekt nie ma włączonego żadnego typu zagadnienia ani żadnej roli z członkami, która bierze udział w przepływie pracy."
  text_project_workflow_project_enable_copy_confirm: Nadać temu projektowi własny przepływ pracy dla tego typu zagadnienia i roli, zaczynając od kopii ogólnego?
  text_project_workflow_project_enable_empty_confirm: Nadać temu projektowi własny, pusty przepływ pracy dla tego typu zagadnienia i roli? Nic nie będzie dozwolone, dopóki nie dodasz reguł.
  text_project_workflow_readonly_generic: "Ten projekt stosuje ogólny przepływ pracy dla tego typu zagadnienia i roli. Poniżej pokazano go dla odniesienia; nadaj projektowi własny przepływ pracy, aby go zmienić."
  text_project_workflow_readonly_own: To jest własny przepływ pracy projektu. Jego zmiana wymaga uprawnienia do zarządzania przepływem pracy tego projektu.
  notice_project_workflow_not_own: "Ten projekt stosuje ogólny przepływ pracy dla tego typu zagadnienia i roli, więc nic nie zostało zapisane. Najpierw nadaj projektowi własny przepływ pracy."
  text_project_workflow_scope_inheriting_note:
    one: "Kombinacje w tym wyborze, które nadal stosują ogólny przepływ pracy: %{count}. Macierz poniżej pokazuje tylko reguły należące do wyboru, więc taka kombinacja wygląda na pustą, a zapis jej nie zmieni — nadaj jej najpierw własny przepływ pracy."
    other: "Kombinacje w tym wyborze, które nadal stosują ogólny przepływ pracy: %{count}. Macierz poniżej pokazuje tylko reguły należące do wyboru, więc takie kombinacje wyglądają na puste, a zapis ich nie zmieni — nadaj im najpierw własny przepływ pracy."
  notice_project_workflow_save_skipped_inheriting:
    one: "Kombinacje projektu, typu zagadnienia i roli, które nadal stosują ogólny przepływ pracy i nie zostały zmienione: %{count}. Nadaj im najpierw własny przepływ pracy."
    other: "Kombinacje projektu, typu zagadnienia i roli, które nadal stosują ogólny przepływ pracy i nie zostały zmienione: %{count}. Nadaj im najpierw własny przepływ pracy."
  label_project_workflow_bulk_row: 'Ustaw cały wiersz "%{name}" na %{value}'
  label_project_workflow_bulk_column: 'Ustaw całą kolumnę "%{name}" na %{value}'
  text_project_workflow_bulk_confirm: 'Ta akcja dotyczy %{count} reguł(y) przepływu pracy. Kontynuować?'
  text_project_workflow_bulk_selection: 'Jedna komórka tej macierzy odpowiada %{count} przepływom pracy: %{trackers} typ(y) zagadnienia × %{roles} rol(e) × %{scopes} zakres(y) przepływu pracy.'
  text_project_workflow_bulk_legend: '"%{no_change}" oznacza, że przepływy pracy reprezentowane przez komórkę nie mówią tego samego; przy zapisie każdy z nich pozostaje bez zmian.'
  text_project_workflow_bulk_legend_actions: 'Akcja wiersza lub kolumny ustawiona na "%{no_change}" przywraca każdej komórce w tym wierszu lub tej kolumnie wartość, z którą strona została otwarta.'
  label_project_workflow_bulk_confirm_threshold: 'Pytaj o potwierdzenie, gdy akcja wiersza lub kolumny zmieni więcej niż'
  text_project_workflow_bulk_confirm_threshold: 'Liczba reguł przepływu pracy. Akcja wiersza lub kolumny, która zmieniłaby więcej, najpierw poprosi o potwierdzenie. 0 pyta zawsze.'
  label_project_workflow_compare: Porównaj z ogólnym przepływem pracy
  label_project_workflow_compare_difference: Różnica
  label_project_workflow_compare_project_only: Tylko w tym projekcie
  label_project_workflow_compare_generic_only: Tylko w ogólnym przepływie pracy
  label_project_workflow_compare_changed: Inne
  label_project_workflow_compare_condition: Dotyczy
  label_project_workflow_compare_in_project: W tym projekcie
  label_project_workflow_compare_in_generic: W ogólnym przepływie pracy
  label_project_workflow_condition_always: Każdy z tą rolą
  label_project_workflow_condition_author: Także gdy użytkownik jest autorem
  label_project_workflow_condition_assignee: Także gdy użytkownik jest przypisany
  text_project_workflow_compare_description: Przepływ pracy tego projektu zastępuje ogólny dla tego typu zagadnienia i tej roli, więc poniżej znajduje się cała różnica. Nic nie jest łączone i nic z ogólnego przepływu pracy już nie obowiązuje.
  text_project_workflow_compare_counts: 'Ten projekt ma własnych reguł dla tego typu zagadnienia i tej roli: %{project}; ogólny przepływ pracy ma %{generic}.'
  text_project_workflow_compare_identical: Własny przepływ pracy tego projektu jest identyczny z ogólnym dla tego typu zagadnienia i tej roli.
  text_project_workflow_compare_inherits: "Ten projekt stosuje ogólny przepływ pracy dla tego typu zagadnienia i tej roli, więc nie ma nic do porównania."
  button_project_workflow_bulk_undo: Cofnij
  text_project_workflow_bulk_changed: 'Zmienione komórki: %{cells}; reguły przepływu pracy: %{rules}.'
  text_project_workflow_bulk_undone: 'Cofnięto; przywrócone komórki: %{cells}.'
  text_project_workflow_bulk_unsaved: Nic nie zostało jeszcze zapisane. Naciśnij Zapisz, aby zastosować te zmiany.
  label_project_workflow_comparison: Porównanie przepływów pracy
  text_project_workflow_compare_unreachable_field: Co najmniej jedna różnica poniżej dotyczy pola, którego ten typ zagadnienia już nie udostępnia, więc własna macierz projektu nie może go pokazać ani zmienić. Administrator systemu może usunąć taką regułę w Administracji.
  label_project_workflow_map: Przepływ pracy dla tego zagadnienia
  label_project_workflow_map_scope: Który przepływ pracy obowiązuje
  label_project_workflow_map_from_here: Zmiany statusu dozwolone z tego miejsca
  label_project_workflow_map_leads_here: Statusy, które prowadzą do tego
  label_project_workflow_map_available: Dostępne teraz
  text_project_workflow_map_authority: To jest to, na co pozwala przepływ pracy. O tym, co możesz zrobić w tej chwili, decyduje lista statusów w formularzu; każda różnica między nimi jest wyjaśniona poniżej.
  text_project_workflow_map_no_outgoing: Ten przepływ pracy nie pozwala na żadną zmianę statusu z tego miejsca.
  text_project_workflow_map_no_incoming: Ten przepływ pracy nie pozwala na żadną zmianę statusu na ten status.
  text_project_workflow_map_no_roles: Nie masz w tym projekcie żadnej roli biorącej udział w przepływie pracy, więc żadna zmiana statusu nie jest dozwolona.
  text_project_workflow_map_own_empty: Ten projekt ma własny przepływ pracy dla tego typu zagadnienia i tej roli, i nie zawiera on żadnej reguły, więc żadna zmiana statusu nie jest dozwolona. Jest to świadoma konfiguracja, a nie błąd.
  text_project_workflow_map_requires_author: Tylko autor zagadnienia może dokonać tej zmiany.
  text_project_workflow_map_requires_assignee: Tylko osoba przypisana może dokonać tej zmiany.
  text_project_workflow_map_requires_author_or_assignee: Tylko autor lub osoba przypisana może dokonać tej zmiany.
  text_project_workflow_map_unavailable: Obecnie niedostępne dla tego zagadnienia.
  label_project_workflow_map_condition_author: Tylko gdy użytkownik jest autorem
  label_project_workflow_map_condition_assignee: Tylko gdy użytkownik jest osobą przypisaną
  label_project_workflow_map_condition_author_or_assignee: Tylko gdy użytkownik jest autorem lub osobą przypisaną
