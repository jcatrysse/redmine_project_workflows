fr:
  label_project_workflows_global: Générique
  error_workflow_copy_source_project: Veuillez sélectionner un tracker, un rôle et un projet source.
  error_workflow_copy_target: Veuillez sélectionner des trackers, rôles et projets cibles.
  error_workflow_copy_target_project: Un ou plusieurs des projets cibles sélectionnés n'existent pas.
  label_project_workflow_scope: Workflow pour les projets sélectionnés
  label_project_workflow_state_inherits: Hérite du workflow générique
  label_project_workflow_state_own: Workflow propre
  label_project_workflow_state_own_empty: Workflow propre vide
  label_project_workflow_count_own:
    one: "%{count} workflow propre"
    other: "%{count} workflows propres"
  label_project_workflow_count_own_empty:
    one: "%{count} workflow propre vide"
    other: "%{count} workflows propres vides"
  label_project_workflow_count_inherits:
    one: "%{count} hérite du workflow générique"
    other: "%{count} héritent du workflow générique"
  button_project_workflow_enable_copy: Donner un workflow propre (copie du générique)
  button_project_workflow_enable_empty: Donner un workflow propre vide
  button_project_workflow_clear: Vider ce workflow
  button_project_workflow_inherit: Revenir au workflow générique
  text_project_workflow_scope_help: Un workflow propre remplace le workflow générique ; il ne s'y ajoute jamais. Un workflow propre vide n'autorise rien.
  text_project_workflow_enable_copy_confirm: Donner à ce projet son propre workflow, en partant d'une copie du générique ? Cela concerne %{count} combinaison(s) de projet, tracker et rôle.
  text_project_workflow_enable_empty_confirm: Donner à ce projet son propre workflow, vide ? Rien ne sera autorisé tant que vous n'aurez pas ajouté de règles. Cela concerne %{count} combinaison(s) de projet, tracker et rôle.
  text_project_workflow_clear_confirm: Supprimer toutes les règles de ce workflow ? Le projet conserve son propre workflow, mais celui-ci n'autorisera rien.
  text_project_workflow_inherit_confirm: Revenir au workflow générique ? Les règles propres du projet sont supprimées.
  notice_project_workflow_enabled_copy:
    one: "%{count} workflow copié depuis le générique."
    other: "%{count} workflows copiés depuis le générique."
  notice_project_workflow_enabled_empty:
    one: "%{count} workflow propre vide créé."
    other: "%{count} workflows propres vides créés."
  notice_project_workflow_inherited:
    one: "%{count} workflow revenu au générique."
    other: "%{count} workflows revenus au générique."
  notice_project_workflow_emptied:
    one: "%{count} workflow vidé."
    other: "%{count} workflows vidés."
  notice_project_workflow_scope_unchanged: Rien n'avait à être modifié.
  label_project_workflow_inventory: Inventaire des workflows
  label_project_workflow_rule_type: Type de règle
  label_project_workflow_inventory_deviations_only: Uniquement les projets ayant leur propre workflow
  text_project_workflow_inventory_description: "Une ligne par projet, tracker et rôle. Le nombre indique combien de règles le projet possède lui-même ; le libellé indique si ce sont ces règles qui s'appliquent, ou le workflow général."
  text_project_workflow_inventory_empty: Aucun projet n'a son propre workflow pour cette sélection.
  text_project_workflow_inventory_empty_filtered: Aucune combinaison de projet, tracker et rôle ne correspond à cette sélection.
  button_project_workflow_inventory_show_all: Afficher tous les projets, trackers et rôles
  button_project_workflow_inventory_open_matrices: Ouvrir les matrices de workflow
  error_project_workflow_inventory_filter: Une ou plusieurs valeurs de filtre n'existent plus et ont été ignorées.
  permission_view_project_workflow: Consulter le workflow du projet
  permission_manage_project_workflow: Gérer le workflow du projet
  label_project_workflow_project_scope: Workflow de ce projet
  label_project_workflow_open_matrix: Ouvrir ce workflow
  text_project_workflow_tab_description: Une ligne par tracker et rôle dont ce projet peut décider. Le nombre indique combien de règles le projet possède lui-même ; le libellé dit si ce sont ces règles qui s'appliquent ou le workflow générique.
  text_project_workflow_tab_nothing_to_configure: "Il n'y a encore rien à configurer ici : ce projet n'a aucun tracker activé, ou aucun rôle avec des membres qui participe à un workflow."
  text_project_workflow_project_enable_copy_confirm: Donner à ce projet son propre workflow pour ce tracker et ce rôle, à partir d'une copie du workflow générique ?
  text_project_workflow_project_enable_empty_confirm: Donner à ce projet son propre workflow, vide, pour ce tracker et ce rôle ? Rien ne sera autorisé jusqu'à ce que vous ajoutiez des règles.
  text_project_workflow_readonly_generic: Ce projet hérite du workflow générique pour ce tracker et ce rôle. Il est affiché ci-dessous à titre de référence ; donnez au projet son propre workflow pour le modifier.
  text_project_workflow_readonly_own: Ceci est le workflow propre au projet. Le modifier demande la permission de gérer le workflow de ce projet.
  notice_project_workflow_not_own: Ce projet hérite du workflow générique pour ce tracker et ce rôle ; rien n'a donc été enregistré. Donnez d'abord au projet son propre workflow.
  label_project_workflow_bulk_row: 'Mettre toute la ligne "%{name}" à %{value}'
  label_project_workflow_bulk_column: 'Mettre toute la colonne "%{name}" à %{value}'
  text_project_workflow_bulk_confirm: 'Cette action concerne %{count} règle(s) de workflow. Continuer ?'
  text_project_workflow_bulk_selection: 'Une cellule de cette matrice représente %{count} workflow(s) : %{trackers} tracker(s) × %{roles} rôle(s) × %{scopes} portée(s) de workflow.'
  text_project_workflow_bulk_legend: '"%{no_change}" signifie que les workflows représentés par une cellule ne disent pas tous la même chose ; à l''enregistrement, chacun reste tel quel.'
  text_project_workflow_bulk_legend_actions: 'Une action de ligne ou de colonne réglée sur "%{no_change}" remet chaque cellule de cette ligne ou de cette colonne à la valeur avec laquelle la page a été ouverte.'
  label_project_workflow_bulk_confirm_threshold: 'Demander confirmation lorsqu''une action de ligne ou de colonne modifie plus de'
  text_project_workflow_bulk_confirm_threshold: 'Nombre de règles de workflow. Une action de ligne ou de colonne qui en modifierait davantage demande d''abord confirmation. 0 demande toujours.'
  label_project_workflow_compare: Comparer avec le workflow générique
  label_project_workflow_compare_difference: Différence
  label_project_workflow_compare_project_only: Uniquement dans ce projet
  label_project_workflow_compare_generic_only: Uniquement dans le workflow générique
  label_project_workflow_compare_changed: Différent
  label_project_workflow_compare_condition: S'applique à
  label_project_workflow_compare_in_project: Dans ce projet
  label_project_workflow_compare_in_generic: Dans le workflow générique
  label_project_workflow_condition_always: Toute personne ayant ce rôle
  label_project_workflow_condition_author: Également lorsque l'utilisateur est l'auteur
  label_project_workflow_condition_assignee: Également lorsque l'utilisateur est l'assigné
  text_project_workflow_compare_description: Le workflow de ce projet remplace le workflow générique pour ce tracker et ce rôle ; ce qui suit constitue donc la totalité de la différence. Rien n'est fusionné et rien du workflow générique ne s'applique encore.
  text_project_workflow_compare_counts: Ce projet possède %{project} règle(s) propre(s) pour ce tracker et ce rôle ; le workflow générique en possède %{generic}.
  text_project_workflow_compare_identical: Le workflow propre de ce projet est identique au workflow générique pour ce tracker et ce rôle.
  text_project_workflow_compare_inherits: 'Ce projet hérite du workflow générique pour ce tracker et ce rôle : il n''y a donc rien à comparer.'
  button_project_workflow_bulk_undo: Annuler
  text_project_workflow_bulk_changed: '%{cells} cellule(s) modifiée(s), %{rules} règle(s) de workflow.'
  text_project_workflow_bulk_undone: 'Annulé : %{cells} cellule(s) rétablie(s).'
  text_project_workflow_bulk_unsaved: Rien n'a encore été enregistré. Cliquez sur Enregistrer pour appliquer ces modifications.
