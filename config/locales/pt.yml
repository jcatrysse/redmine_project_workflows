pt:
  label_project_workflows_global: Geral
  error_workflow_copy_source_project: Selecione um tipo, uma função e um projeto de origem.
  error_workflow_copy_target: Selecione tipos, funções e projetos de destino.
  error_workflow_copy_target_project: Um ou mais projetos de destino selecionados não existem.
  error_workflow_copy_target_tracker_or_role: Um ou mais tipos ou funções de destino selecionados não existem.
  label_project_workflow_scope: Fluxo de trabalho para os projetos selecionados
  label_project_workflow_state_inherits: "Segue o fluxo de trabalho genérico"
  label_project_workflow_state_own: Fluxo de trabalho próprio
  label_project_workflow_state_own_empty: Fluxo de trabalho próprio vazio
  label_project_workflow_count_own:
    one: "%{count} fluxo de trabalho próprio"
    other: "%{count} fluxos de trabalho próprios"
  label_project_workflow_count_own_empty:
    one: "%{count} fluxo de trabalho próprio vazio"
    other: "%{count} fluxos de trabalho próprios vazios"
  label_project_workflow_count_inherits:
    one: "%{count} segue o fluxo de trabalho genérico"
    other: "%{count} seguem o fluxo de trabalho genérico"
  button_project_workflow_enable_copy: Dar fluxo de trabalho próprio (cópia do genérico)
  button_project_workflow_enable_empty: Dar fluxo de trabalho próprio vazio
  button_project_workflow_clear: Esvaziar este fluxo de trabalho
  button_project_workflow_inherit: Voltar ao fluxo de trabalho genérico
  text_project_workflow_scope_help: Um fluxo de trabalho próprio substitui o genérico; nunca é acrescentado a ele. Um fluxo de trabalho próprio vazio não permite nada.
  text_project_workflow_enable_copy_confirm: Dar a este projeto o seu próprio fluxo de trabalho, a partir de uma cópia do genérico? Afeta %{count} combinação(ões) de projeto, tipo e função.
  text_project_workflow_enable_empty_confirm: Dar a este projeto o seu próprio fluxo de trabalho, vazio? Nada será permitido até que adicione regras. Afeta %{count} combinação(ões) de projeto, tipo e função.
  text_project_workflow_clear_confirm: Remover todas as regras deste fluxo de trabalho? O projeto mantém o seu fluxo próprio, mas este não permitirá nada.
  text_project_workflow_inherit_confirm: Voltar ao fluxo de trabalho genérico? As regras próprias do projeto são eliminadas.
  notice_project_workflow_enabled_copy:
    one: "%{count} fluxo de trabalho copiado do genérico."
    other: "%{count} fluxos de trabalho copiados do genérico."
  notice_project_workflow_enabled_empty:
    one: "%{count} fluxo de trabalho próprio vazio criado."
    other: "%{count} fluxos de trabalho próprios vazios criados."
  notice_project_workflow_inherited:
    one: "%{count} fluxo de trabalho devolvido ao genérico."
    other: "%{count} fluxos de trabalho devolvidos ao genérico."
  notice_project_workflow_emptied:
    one: "%{count} fluxo de trabalho esvaziado."
    other: "%{count} fluxos de trabalho esvaziados."
  notice_project_workflow_scope_unchanged: Não havia nada a alterar.
  label_project_workflow_inventory: Inventário dos fluxos de trabalho
  label_project_workflow_rule_type: Tipo de regra
  label_project_workflow_inventory_deviations_only: Apenas projetos com fluxo de trabalho próprio
  text_project_workflow_inventory_description: "Uma linha por projeto, tipo e função. O número indica quantas regras o próprio projeto tem; o rótulo diz se são essas regras que se aplicam, ou o fluxo de trabalho geral."
  text_project_workflow_inventory_empty: Nenhum projeto tem fluxo de trabalho próprio para esta seleção.
  text_project_workflow_inventory_empty_filtered: Nenhuma combinação de projeto, tipo e função corresponde a esta seleção.
  button_project_workflow_inventory_show_all: Mostrar todos os projetos, tipos e funções
  button_project_workflow_inventory_open_matrices: Abrir as matrizes do fluxo de trabalho
  error_project_workflow_inventory_filter: Um ou mais valores de filtro já não existem e foram ignorados.
  permission_view_project_workflow: Ver o fluxo de trabalho do projeto
  permission_manage_project_workflow: Gerir o fluxo de trabalho do projeto
  label_project_workflow_project_scope: Fluxo de trabalho deste projeto
  label_project_workflow_open_matrix: Abrir este fluxo de trabalho
  text_project_workflow_tab_description: Uma linha por cada tipo e função sobre os quais este projeto pode decidir. O número indica quantas regras o próprio projeto tem; a etiqueta diz se são essas regras que se aplicam ou o fluxo de trabalho genérico.
  text_project_workflow_tab_nothing_to_configure: "Ainda não há nada para configurar aqui: este projeto não tem nenhum tipo ativado, nem nenhuma função com membros que participe num fluxo de trabalho."
  text_project_workflow_project_enable_copy_confirm: Dar a este projeto o seu próprio fluxo de trabalho para este tipo e esta função, a partir de uma cópia do genérico?
  text_project_workflow_project_enable_empty_confirm: Dar a este projeto o seu próprio fluxo de trabalho, vazio, para este tipo e esta função? Nada será permitido até que adicione regras.
  text_project_workflow_readonly_generic: "Este projeto segue o fluxo de trabalho genérico para este tipo e esta função. É mostrado abaixo como referência; dê ao projeto o seu próprio fluxo de trabalho para o alterar."
  text_project_workflow_readonly_own: Este é o fluxo de trabalho próprio do projeto. Alterá-lo exige a permissão para gerir o fluxo de trabalho deste projeto.
  notice_project_workflow_not_own: "Este projeto segue o fluxo de trabalho genérico para este tipo e esta função, pelo que nada foi guardado. Dê primeiro ao projeto o seu próprio fluxo de trabalho."
  notice_project_workflow_save_nothing_applied: "Nada foi guardado. Ou nenhuma célula foi alterada, ou os valores enviados não foram aceites."
  notice_project_workflow_save_rejected_values:
    one: "%{count} valor enviado não foi aceite; a regra que indica ficou inalterada."
    other: "%{count} valores enviados não foram aceites; as regras que indicam ficaram inalteradas."
  notice_project_workflow_copy_left_empty:
    one: "%{count} combinação de projeto, tipo e função tem agora o seu próprio fluxo de trabalho vazio: a cópia não deixou lá nenhuma regra desse tipo. Nada é permitido aí até que acrescente regras."
    other: "%{count} combinações de projeto, tipo e função têm agora o seu próprio fluxo de trabalho vazio: a cópia não deixou lá nenhuma regra desse tipo. Nada é permitido aí até que acrescente regras."
  text_project_workflow_scope_inheriting_note:
    one: "%{count} combinação desta seleção segue ainda o fluxo de trabalho genérico. A matriz abaixo mostra apenas as regras que a seleção possui, pelo que essa combinação aparece vazia e guardar não a altera — dê-lhe primeiro o seu próprio fluxo de trabalho."
    other: "%{count} combinações desta seleção seguem ainda o fluxo de trabalho genérico. A matriz abaixo mostra apenas as regras que a seleção possui, pelo que essas combinações aparecem vazias e guardar não as altera — dê-lhes primeiro o seu próprio fluxo de trabalho."
  notice_project_workflow_save_skipped_inheriting:
    one: "%{count} combinação de projeto, tipo e função segue ainda o fluxo de trabalho genérico e não foi alterada. Dê-lhe primeiro o seu próprio fluxo de trabalho."
    other: "%{count} combinações de projeto, tipo e função seguem ainda o fluxo de trabalho genérico e não foram alteradas. Dê-lhes primeiro o seu próprio fluxo de trabalho."
  label_project_workflow_bulk_row: 'Definir toda a linha "%{name}" para %{value}'
  label_project_workflow_bulk_column: 'Definir toda a coluna "%{name}" para %{value}'
  text_project_workflow_bulk_confirm: 'Esta ação afeta %{count} regra(s) de fluxo de trabalho. Continuar?'
  text_project_workflow_bulk_selection: 'Uma célula desta matriz representa %{count} fluxo(s) de trabalho: %{trackers} tipo(s) × %{roles} função(ões) × %{scopes} âmbito(s) de fluxo de trabalho.'
  text_project_workflow_bulk_legend: '"%{no_change}" significa que os fluxos de trabalho representados por uma célula não dizem todos o mesmo; ao guardar, cada um fica como está.'
  text_project_workflow_bulk_legend_actions: 'Uma ação de linha ou de coluna definida como "%{no_change}" devolve cada célula dessa linha ou coluna ao valor com que a página foi aberta.'
  label_project_workflow_bulk_confirm_threshold: 'Pedir confirmação quando uma ação de linha ou de coluna alterar mais de'
  text_project_workflow_bulk_confirm_threshold: 'Número de regras de fluxo de trabalho. Uma ação de linha ou de coluna que alterasse mais do que isto pede primeiro confirmação. 0 pergunta sempre.'
  label_project_workflow_compare: Comparar com o fluxo de trabalho genérico
  label_project_workflow_copy_item: Fluxos de trabalho do projeto
  label_project_workflow_compare_difference: Diferença
  label_project_workflow_compare_project_only: Apenas neste projeto
  label_project_workflow_compare_generic_only: Apenas no fluxo de trabalho genérico
  label_project_workflow_compare_changed: Diferente
  label_project_workflow_compare_condition: Aplica-se a
  label_project_workflow_compare_in_project: Neste projeto
  label_project_workflow_compare_in_generic: No fluxo de trabalho genérico
  label_project_workflow_condition_always: Qualquer pessoa com esta função
  label_project_workflow_condition_author: Também quando o utilizador é o autor
  label_project_workflow_condition_assignee: Também quando o utilizador é o responsável
  text_project_workflow_compare_description: O fluxo de trabalho deste projeto substitui o genérico para este tipo e esta função, pelo que o que se segue é a diferença completa. Nada é combinado e nada do fluxo de trabalho genérico se aplica ainda.
  text_project_workflow_compare_counts: Este projeto tem %{project} regra(s) própria(s) para este tipo e esta função; o fluxo de trabalho genérico tem %{generic}.
  text_project_workflow_compare_identical: O fluxo de trabalho próprio deste projeto é idêntico ao genérico para este tipo e esta função.
  text_project_workflow_compare_inherits: "Este projeto segue o fluxo de trabalho genérico para este tipo e esta função, pelo que não há nada a comparar."
  button_project_workflow_bulk_undo: Desfazer
  text_project_workflow_bulk_changed: '%{cells} célula(s) alterada(s), %{rules} regra(s) de fluxo de trabalho.'
  text_project_workflow_bulk_undone: 'Desfeito: %{cells} célula(s) reposta(s).'
  text_project_workflow_bulk_unsaved: Ainda não foi guardado nada. Prima Guardar para aplicar estas alterações.
  label_project_workflow_comparison: Comparação de fluxos de trabalho
  text_project_workflow_compare_unreachable_field: Pelo menos uma diferença abaixo refere-se a um campo que este tipo já não oferece, pelo que a matriz própria do projeto não o pode mostrar nem alterar. Um administrador de sistema pode remover essa regra na Administração.
  label_project_workflow_map: Fluxo de trabalho desta tarefa
  label_project_workflow_map_scope: Que fluxo de trabalho se aplica
  label_project_workflow_map_from_here: Mudanças de estado permitidas a partir daqui
  label_project_workflow_map_leads_here: Estados que conduzem a este
  label_project_workflow_map_available: Disponível agora
  text_project_workflow_map_authority: É isto que o fluxo de trabalho permite. A lista de estados no formulário continua a ser a referência para o que pode fazer neste momento; cada diferença entre as duas é explicada abaixo.
  text_project_workflow_map_no_outgoing: Este fluxo de trabalho não permite qualquer mudança de estado a partir daqui.
  text_project_workflow_map_no_incoming: Este fluxo de trabalho não permite qualquer mudança de estado para este.
  text_project_workflow_map_no_roles: Não tem neste projeto nenhuma função que participe num fluxo de trabalho, pelo que nenhuma mudança de estado é permitida.
  text_project_workflow_map_own_empty: Este projeto tem o seu próprio fluxo de trabalho para este tipo e esta função, e não contém qualquer regra, pelo que nenhuma mudança de estado é permitida. É uma configuração deliberada e não uma falha.
  text_project_workflow_map_own_empty_some: 'Pelo menos uma das suas funções tem aqui um fluxo de trabalho próprio que não contém qualquer regra, pelo que essa função não permite qualquer mudança de estado. Outra das suas funções pode ainda assim permitir algumas. É uma configuração deliberada e não uma falha.'
  text_project_workflow_map_requires_author: Só o autor da tarefa pode fazer esta alteração.
  text_project_workflow_map_requires_assignee: Só a pessoa atribuída pode fazer esta alteração.
  text_project_workflow_map_requires_author_or_assignee: Só o autor ou a pessoa atribuída pode fazer esta alteração.
  text_project_workflow_map_unavailable: Não disponível para esta tarefa neste momento.
  label_project_workflow_map_condition_author: Apenas quando o utilizador é o autor
  label_project_workflow_map_condition_assignee: Apenas quando o utilizador é a pessoa atribuída
  label_project_workflow_map_condition_author_or_assignee: Apenas quando o utilizador é o autor ou a pessoa atribuída
  label_project_workflow_graph: Diagrama do fluxo de trabalho
  label_project_workflow_graph_roles: Perfis apresentados
  label_project_workflow_graph_diagnostics: Ao que prestar atenção
  label_project_workflow_graph_table: O mesmo fluxo de trabalho em tabela
  label_project_workflow_graph_unreachable: Não é possível chegar a partir de uma nova tarefa
  label_project_workflow_graph_dead_end: Daqui não sai nada
  label_project_workflow_graph_unmentioned: Não utilizado pelos perfis selecionados
  label_project_workflow_graph_fallback: 'Recurso do próprio Redmine'
  label_project_workflow_graph_show_anyway: 'Mostrar o diagrama mesmo assim'
  text_project_workflow_graph_aria: 'Diagrama deste fluxo de trabalho: %{statuses} estados e %{transitions} transições. A mesma informação está na tabela abaixo.'
  text_project_workflow_graph_aria_fallback: 'Mais uma seta é o recurso do próprio Redmine e não uma transição configurada: é onde uma nova tarefa começa.'
  text_project_workflow_graph_no_roles: Nenhum dos perfis selecionados participa num fluxo de trabalho, por isso não há nada para desenhar.
  text_project_workflow_graph_empty: Pelo menos um dos perfis selecionados tem aqui um fluxo de trabalho próprio que não contém qualquer regra, pelo que não lhe é permitida qualquer mudança de estado. É uma configuração deliberada e não uma falha.
  text_project_workflow_graph_nothing: 'O fluxo de trabalho que se aplica aqui não contém qualquer transição para os perfis selecionados, pelo que o estado de uma tarefa existente nunca pode mudar.'
  text_project_workflow_graph_no_diagnostics: Todos os estados deste fluxo de trabalho podem ser alcançados a partir de uma nova tarefa e têm saída.
  text_project_workflow_graph_dense: 'Este fluxo de trabalho permite quase todas as mudanças: quase qualquer estado pode tornar-se quase qualquer outro. Não há qualquer progressão que um diagrama possa mostrar, pelo que a tabela abaixo é a sua forma legível.'
  text_project_workflow_graph_legend_solid: Uma seta contínua é uma alteração que qualquer pessoa com o perfil pode fazer.
  text_project_workflow_graph_legend_dashed: Uma seta tracejada é uma alteração que só o autor ou o responsável podem fazer.
  text_project_workflow_graph_legend_fallback: 'Uma seta pontilhada é o recurso do próprio Redmine e não uma regra: nenhuma regra indica com que estado começa uma tarefa nova, pelo que o Redmine a cria com o estado predefinido do tipo.'
  text_project_workflow_graph_legend_band: Os estados abaixo da linha pontilhada não podem ser alcançados a partir de uma nova tarefa.
