en:
  label_project_workflows_global: Generic
  error_workflow_copy_source_project: Please select a source tracker, role, and project.
  error_workflow_copy_target: Please select target trackers, roles, and projects.
  error_workflow_copy_target_project: One or more selected target projects do not exist.
  error_workflow_copy_target_tracker_or_role: One or more selected target trackers or roles do not exist.
  label_project_workflow_scope: Workflow for the selected projects
  label_project_workflow_state_inherits: "Follows the generic workflow"
  label_project_workflow_state_own: Own workflow
  label_project_workflow_state_own_empty: Own empty workflow
  label_project_workflow_count_own:
    one: "%{count} own workflow"
    other: "%{count} own workflows"
  label_project_workflow_count_own_empty:
    one: "%{count} own empty workflow"
    other: "%{count} own empty workflows"
  label_project_workflow_count_inherits:
    one: "%{count} follows the generic workflow"
    other: "%{count} follow the generic workflow"
  button_project_workflow_enable_copy: Give own workflow (copy of the generic one)
  button_project_workflow_enable_empty: Give own empty workflow
  button_project_workflow_clear: Empty this workflow
  button_project_workflow_inherit: Return to the generic workflow
  text_project_workflow_scope_help: An own workflow replaces the generic one; it is never added to it. An own empty workflow permits nothing.
  text_project_workflow_enable_copy_confirm: Give this project its own workflow, starting as a copy of the generic one? This affects %{count} combination(s) of project, tracker and role.
  text_project_workflow_enable_empty_confirm: Give this project its own, empty workflow? Nothing will be permitted until you add rules. This affects %{count} combination(s) of project, tracker and role.
  text_project_workflow_clear_confirm: Remove every rule from this workflow? The project keeps its own workflow, but it will permit nothing.
  text_project_workflow_inherit_confirm: Return to the generic workflow? The project's own rules are deleted.
  notice_project_workflow_enabled_copy:
    one: "%{count} workflow copied from the generic one."
    other: "%{count} workflows copied from the generic one."
  notice_project_workflow_enabled_empty:
    one: "%{count} own empty workflow created."
    other: "%{count} own empty workflows created."
  notice_project_workflow_inherited:
    one: "%{count} workflow returned to the generic one."
    other: "%{count} workflows returned to the generic one."
  notice_project_workflow_emptied:
    one: "%{count} workflow emptied."
    other: "%{count} workflows emptied."
  notice_project_workflow_scope_unchanged: Nothing had to be changed.
  label_project_workflow_inventory: Workflow inventory
  label_project_workflow_rule_type: Kind of rule
  label_project_workflow_inventory_deviations_only: Only projects with their own workflow
  text_project_workflow_inventory_description: One line per project, tracker and role. The number is how many rules the project holds itself; the label says whether those rules are what applies, or whether the generic workflow does.
  text_project_workflow_inventory_empty: No project has its own workflow for this selection.
  text_project_workflow_inventory_empty_filtered: No project, tracker and role match this selection.
  button_project_workflow_inventory_show_all: Show every project, tracker and role
  button_project_workflow_inventory_open_matrices: Open the workflow matrices
  error_project_workflow_inventory_filter: One or more filter values no longer exist and have been ignored.
  permission_view_project_workflow_rules: View the project's workflow
  permission_manage_project_workflow_rules: Manage the project's workflow
  label_project_workflow_project_scope: This project's workflow
  label_project_workflow_open_matrix: Open this workflow
  text_project_workflow_tab_description: One line per tracker and role this project can decide for. The number is how many rules the project holds itself; the label says whether those rules are what applies, or whether the generic workflow does.
  text_project_workflow_tab_nothing_to_configure: "There is nothing to configure here yet: this project has no tracker enabled, or no role with members that takes part in a workflow."
  text_project_workflow_project_enable_copy_confirm: Give this project its own workflow for this tracker and role, starting as a copy of the generic one?
  text_project_workflow_project_enable_empty_confirm: Give this project its own, empty workflow for this tracker and role? Nothing will be permitted until you add rules.
  text_project_workflow_readonly_generic: "This project follows the generic workflow for this tracker and role. It is shown below for reference; give the project its own workflow to change it."
  text_project_workflow_readonly_own: This is the project's own workflow. Changing it needs the permission to manage this project's workflow.
  notice_project_workflow_not_own: "This project follows the generic workflow for this tracker and role, so nothing was saved. Give the project its own workflow first."
  notice_project_workflow_save_nothing_applied: "Nothing was saved. Either no cell was changed, or the values submitted were not accepted."
  notice_project_workflow_save_rejected_values:
    one: "%{count} submitted value was not accepted and the rule it names was left unchanged."
    other: "%{count} submitted values were not accepted and the rules they name were left unchanged."
  notice_project_workflow_copy_left_empty:
    one: "%{count} combination of project, tracker and role now has its own empty workflow: the copy left no rules of that kind behind. Nothing is permitted there until you add some."
    other: "%{count} combinations of project, tracker and role now have their own empty workflow: the copy left no rules of that kind behind. Nothing is permitted there until you add some."
  text_project_workflow_scope_inheriting_note:
    one: "%{count} combination in this selection still follows the generic workflow. The matrix below shows only the rules the selection stores itself, so that combination appears empty, and saving will not change it — give it its own workflow first."
    other: "%{count} combinations in this selection still follow the generic workflow. The matrix below shows only the rules the selection stores itself, so those combinations appear empty, and saving will not change them — give them their own workflow first."
  notice_project_workflow_save_skipped_inheriting:
    one: "%{count} combination of project, tracker and role still follows the generic workflow and was not changed. Give it its own workflow first."
    other: "%{count} combinations of project, tracker and role still follow the generic workflow and were not changed. Give them their own workflow first."
  label_project_workflow_bulk_row: 'Set the whole row "%{name}" to %{value}'
  label_project_workflow_bulk_column: 'Set the whole column "%{name}" to %{value}'
  text_project_workflow_bulk_confirm: 'This action affects %{count} workflow rule(s). Continue?'
  text_project_workflow_bulk_selection: 'One cell of this matrix stands for %{count} workflow(s): %{trackers} tracker(s) × %{roles} role(s) × %{scopes} workflow scope(s).'
  text_project_workflow_bulk_legend: '"%{no_change}" means the workflows a cell stands for do not all say the same thing; saving leaves each of them as it is.'
  text_project_workflow_bulk_legend_actions: 'A row or column action set to "%{no_change}" puts every cell in that row or column back to the value the page was opened with.'
  label_project_workflow_bulk_confirm_threshold: 'Ask before a row or column action changes more than'
  text_project_workflow_bulk_confirm_threshold: 'Number of workflow rules. A row or column action that would change more than this asks for confirmation first. 0 asks every time.'
  text_project_workflow_save_confirm: 'Saving this matrix rewrites %{count} workflow rule(s). Continue?'
  label_project_workflow_bulk_save_confirm_threshold: 'Ask before Save rewrites more than'
  text_project_workflow_bulk_save_confirm_threshold: 'Number of workflow rules. Saving an administration matrix that covers more than one workflow asks for confirmation once it would rewrite more than this. Saving a single workflow never asks. 0 asks every time.'
  label_project_workflow_bulk_write_ceiling: 'Refuse a matrix save that would rewrite more than'
  text_project_workflow_bulk_write_ceiling: 'Number of workflow rules. An administration matrix save larger than this is refused before anything is written, so that one save cannot hold the workflow tables for minutes. 0 means no limit.'
  error_project_workflow_save_too_large: 'This save would rewrite %{count} workflow rule(s), which is more than the limit of %{ceiling}. Nothing was changed. Select fewer projects, trackers or roles, or raise the limit in the plugin settings.'
  label_project_workflow_compare: Compare with the generic workflow
  label_project_workflow_copy_item: Project workflows
  label_project_workflow_compare_difference: Difference
  label_project_workflow_compare_project_only: Only in this project
  label_project_workflow_compare_generic_only: Only in the generic workflow
  label_project_workflow_compare_changed: Different
  label_project_workflow_compare_condition: Applies to
  label_project_workflow_compare_in_project: In this project
  label_project_workflow_compare_in_generic: In the generic workflow
  label_project_workflow_condition_always: Anyone with this role
  label_project_workflow_condition_author: Also when the user is the author
  label_project_workflow_condition_assignee: Also when the user is the assignee
  text_project_workflow_compare_description: This project's workflow replaces the generic one for this tracker and role, so what is listed below is the whole of the difference. Nothing is merged and nothing from the generic workflow still applies.
  text_project_workflow_compare_counts: This project holds %{project} rule(s) of its own for this tracker and role; the generic workflow holds %{generic}.
  text_project_workflow_compare_identical: This project's own workflow is identical to the generic one for this tracker and role.
  text_project_workflow_compare_inherits: "This project follows the generic workflow for this tracker and role, so there is nothing to compare."
  button_project_workflow_bulk_undo: Undo
  text_project_workflow_bulk_changed: Changed %{cells} cell(s), %{rules} workflow rule(s).
  text_project_workflow_bulk_undone: 'Undone: %{cells} cell(s) put back.'
  text_project_workflow_bulk_unsaved: Nothing has been saved yet. Press Save to apply these changes.
  label_project_workflow_comparison: Workflow comparison
  text_project_workflow_compare_unreachable_field: At least one difference below names a field this tracker no longer offers, so the project's own matrix cannot show or change it. A system administrator can remove such a rule from Administration.
  label_project_workflow_map: Workflow for this issue
  label_project_workflow_map_scope: Which workflow applies
  label_project_workflow_map_from_here: Status changes allowed from here
  label_project_workflow_map_leads_here: Statuses that lead to this one
  label_project_workflow_map_available: Offered now
  text_project_workflow_map_authority: This is what the workflow allows. The status list on the form stays the authority for what you may do right now, and every difference between the two is explained below.
  text_project_workflow_map_no_outgoing: This workflow permits no change of status from here.
  text_project_workflow_map_no_incoming: This workflow permits no change of status into this one.
  text_project_workflow_map_no_roles: You hold no role in this project that takes part in a workflow, so no change of status is permitted.
  text_project_workflow_map_own_empty: This project has its own workflow for this tracker and role, and it holds no rule at all, so no change of status is permitted. That is a deliberate configuration and not a fault.
  text_project_workflow_map_own_empty_some: 'At least one of your roles here has a workflow of its own that holds no rule at all, so that role permits no change of status. Another of your roles may still permit some. That is a deliberate configuration and not a fault.'
  text_project_workflow_map_requires_author: Only the author of the issue may make this change.
  text_project_workflow_map_requires_assignee: Only the assignee of the issue may make this change.
  text_project_workflow_map_requires_author_or_assignee: Only the author or the assignee of the issue may make this change.
  text_project_workflow_map_unavailable: Not offered for this issue at the moment.
  label_project_workflow_map_condition_author: Only when the user is the author
  label_project_workflow_map_condition_assignee: Only when the user is the assignee
  label_project_workflow_map_condition_author_or_assignee: Only when the user is the author or the assignee
  label_project_workflow_graph: Workflow diagram
  label_project_workflow_graph_roles: Roles shown
  label_project_workflow_graph_diagnostics: What to look at
  label_project_workflow_graph_table: The same workflow as a table
  label_project_workflow_graph_unreachable: Cannot be reached from a new issue
  label_project_workflow_graph_dead_end: Nothing leads out of these
  label_project_workflow_graph_unmentioned: Not used by the selected roles
  label_project_workflow_graph_fallback: 'Redmine''s own fallback'
  label_project_workflow_graph_show_anyway: 'Show the diagram anyway'
  text_project_workflow_graph_aria: 'Diagram of this workflow: %{statuses} statuses and %{transitions} transitions. The same information is in the table below.'
  text_project_workflow_graph_aria_fallback: 'One further arrow is Redmine''s own fallback rather than a configured transition: it is where a new issue starts.'
  text_project_workflow_graph_no_roles: None of the selected roles takes part in a workflow, so there is nothing to draw.
  text_project_workflow_graph_empty: At least one of the selected roles has a workflow of its own here that holds no rule at all, so no change of status is permitted for it. That is a deliberate configuration and not a fault.
  text_project_workflow_graph_nothing: 'The workflow that applies here holds no transition at all for the selected roles, so once an issue exists its status can never change.'
  text_project_workflow_graph_no_diagnostics: Every status in this workflow can be reached from a new issue and has a way out.
  text_project_workflow_graph_dense: 'This workflow permits nearly every move: almost every status may become almost every other one. There is no progression for a diagram to show, so the table below is the readable form of it.'
  text_project_workflow_graph_legend_solid: A solid arrow is a change anyone holding the role may make.
  text_project_workflow_graph_legend_dashed: A dashed arrow is a change only the author or the assignee may make.
  text_project_workflow_graph_legend_fallback: 'A dotted arrow is Redmine''s own fallback rather than a rule: no rule says which status a new issue starts in, so Redmine starts it on the tracker''s default status.'
  text_project_workflow_graph_legend_band: Statuses below the dotted line cannot be reached from a new issue.
  label_project_workflow_diagnostics: 'Project workflow diagnostics'
  label_project_workflow_diagnostics_compatibility: 'This Redmine'
  label_project_workflow_diagnostics_host: 'Running'
  label_project_workflow_diagnostics_tested: 'Tested against'
  label_project_workflow_diagnostics_database: 'Database'
  label_project_workflow_diagnostics_drift: 'What has changed'
  label_project_workflow_diagnostics_source: 'Where Redmine defines it'
  label_project_workflow_diagnostics_screen: 'Screen'
  label_project_workflow_diagnostics_anchor: 'Anchor'
  label_project_workflow_diagnostics_anchor_matched: 'Found'
  label_project_workflow_diagnostics_anchor_unmatched: 'Not found'
  label_project_workflow_diagnostics_anchor_unmeasured: 'Could not be checked'
  label_project_workflow_diagnostics_patches: 'Redmine classes this plugin changes'
  label_project_workflow_diagnostics_overrides: 'Redmine screens this plugin changes'
  label_project_workflow_diagnostics_changed: 'Changed'
  label_project_workflow_diagnostics_missing: 'Gone from Redmine'
  label_project_workflow_diagnostics_added: 'New in Redmine'
  label_project_workflow_diagnostics_ok: 'In order'
  label_project_workflow_diagnostics_not_ok: 'Needs attention'
  text_project_workflow_diagnostics_description: 'What this plugin looks like on this server. Everything here is read; nothing on this page changes anything.'
  text_project_workflow_diagnostics_verified: 'Redmine %{version} is a version this plugin is tested against, on every change, with three databases.'
  text_project_workflow_diagnostics_unverified: 'Nobody has tested this plugin against Redmine %{version}. Every part of Redmine it replaces is nevertheless identical to Redmine %{newest}, the newest version it was tested against.'
  text_project_workflow_diagnostics_drifted: 'Nobody has tested this plugin against Redmine %{version}, and %{methods} of the parts of Redmine it replaces have changed since Redmine %{newest}, the newest version it was tested against. The plugin goes on working; read the differences below before trusting it.'
  text_project_workflow_diagnostics_drift_help: 'This plugin does not extend these parts of Redmine, it replaces them, so a change here is a change it has not followed. The comparison shows that the text of each one is unchanged. It cannot show that Redmine still uses them in the same way.'
  text_project_workflow_diagnostics_permission_captured: 'Another plugin has registered this name, and Redmine answers with theirs. This plugin''s screens will refuse everybody, administrators included. %{claimants} plugins claim the name.'
  text_project_workflow_diagnostics_patch_missing: 'Not in place. Redmine behaves as it does without this plugin here.'
  text_project_workflow_diagnostics_overrides_help: 'These are additions to screens Redmine owns. Each one hangs on a piece of Redmine''s own markup, and Redmine says nothing at all when that piece is no longer there, so the screen simply comes out missing a control. This checks, on this server, whether each one still finds the place it belongs.'
  text_project_workflow_diagnostics_anchor_unmatched: 'This addition has nowhere to go on this Redmine, so the screen is missing it. Selector: %{selector}'
  text_project_workflow_diagnostics_unmeasured: 'Nobody has tested this plugin against Redmine %{version}, and this Ruby cannot read Redmine''s own source, so no comparison was possible.'
  # WP12 / ADR-003: the plugin's own administration area.
  label_project_workflow_rules: 'Project workflows'
  label_project_workflow_generic_screens: 'Redmine''s own workflow'
  # WP14 / audit F03: what deleting an issue status left behind.
  warning_project_workflow_status_deleted_emptied:
    one: "%{count} project workflow now holds no rule at all: every rule it had named the status that was just deleted. The project keeps its own workflow there, and an own transitions workflow without rules permits no change of status. Review it in %{link}, and either add rules or return it to the generic workflow."
    other: "%{count} project workflows now hold no rule at all: every rule they had named the status that was just deleted. Those projects keep their own workflow there, and an own transitions workflow without rules permits no change of status. Review them in %{link}, and either add rules or return them to the generic workflow."
  # WP14: the workflow drawing as a switchable feature with a size ceiling.
  label_project_workflow_graph_enabled: 'Offer the workflow diagram'
  text_project_workflow_graph_enabled: 'The diagram is a read-only screen reached from a project''s workflow settings, its matrices and the issue form. Turn it off and no link to it is offered anywhere and the screen itself answers "not found"; everything else is unaffected.'
  label_project_workflow_graph_edge_ceiling: 'Do not draw a workflow with more than'
  text_project_workflow_graph_edge_ceiling: 'Number of arrows, which is what deciding where to draw them costs: a workflow of 400 statuses and 800 arrows is laid out in about 50 ms, one of 60 statuses where nearly every move is permitted takes about 1.5 s. Above this the workflow is listed as a table instead of drawn. 0 means no limit.'
  text_project_workflow_graph_too_large: 'This workflow has %{count} transition(s), more than the %{ceiling} this installation draws, so it is not drawn and its diagnostics are not listed. The table below is the whole workflow. A system administrator can raise the limit in the plugin settings.'
  # ADR-004: the same ceiling as the matrix save, on *give own workflow*.
  error_project_workflow_enable_too_large: 'Giving these projects their own workflow would copy %{count} workflow rule(s), which is more than the limit of %{ceiling}. Nothing was changed. Select fewer projects, trackers or roles, give an own empty workflow instead, or raise the limit in the plugin settings.'
