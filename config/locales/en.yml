en:
  label_project_workflows_global: Generic
  error_workflow_copy_source_project: Please select a source tracker, role, and project.
  error_workflow_copy_target: Please select target trackers, roles, and projects.
  error_workflow_copy_target_project: One or more selected target projects do not exist.
  label_project_workflow_scope: Workflow for the selected projects
  label_project_workflow_state_inherits: Inherits the generic workflow
  label_project_workflow_state_own: Own workflow
  label_project_workflow_state_own_empty: Own empty workflow
  label_project_workflow_count_own:
    one: "%{count} own workflow"
    other: "%{count} own workflows"
  label_project_workflow_count_own_empty:
    one: "%{count} own empty workflow"
    other: "%{count} own empty workflows"
  label_project_workflow_count_inherits:
    one: "%{count} inherits the generic workflow"
    other: "%{count} inherit the generic workflow"
  button_project_workflow_enable_copy: Give own workflow (copy of the generic one)
  button_project_workflow_enable_empty: Give own empty workflow
  button_project_workflow_clear: Empty this workflow
  button_project_workflow_inherit: Return to the generic workflow
  text_project_workflow_scope_help: An own workflow replaces the generic one; it is never added to it. An own empty workflow permits nothing.
  text_project_workflow_enable_copy_confirm: Give this project its own workflow, starting as a copy of the generic one? This affects %{count} combination(s) of project, tracker and role.
  text_project_workflow_enable_empty_confirm: Give this project its own, empty workflow? Nothing will be permitted until you add rules. This affects %{count} combination(s) of project, tracker and role.
  text_project_workflow_clear_confirm: Remove every rule from this workflow? The project keeps its own workflow, but it will permit nothing.
  text_project_workflow_inherit_confirm: Return to the generic workflow? The project's own rules are deleted.
  notice_project_workflow_enabled_copy:
    one: "%{count} workflow copied from the generic one."
    other: "%{count} workflows copied from the generic one."
  notice_project_workflow_enabled_empty:
    one: "%{count} own empty workflow created."
    other: "%{count} own empty workflows created."
  notice_project_workflow_inherited:
    one: "%{count} workflow returned to the generic one."
    other: "%{count} workflows returned to the generic one."
  notice_project_workflow_emptied:
    one: "%{count} workflow emptied."
    other: "%{count} workflows emptied."
  notice_project_workflow_scope_unchanged: Nothing had to be changed.
  label_project_workflow_inventory: Workflow inventory
  label_project_workflow_rule_type: Kind of rule
  label_project_workflow_inventory_deviations_only: Only projects with their own workflow
  text_project_workflow_inventory_description: One line per project, tracker and role. The number is how many rules the project holds itself; the label says whether those rules are what applies, or whether the generic workflow does.
  text_project_workflow_inventory_empty: No project has its own workflow for this selection.
  text_project_workflow_inventory_empty_filtered: No project, tracker and role match this selection.
  button_project_workflow_inventory_show_all: Show every project, tracker and role
  button_project_workflow_inventory_open_matrices: Open the workflow matrices
  error_project_workflow_inventory_filter: One or more filter values no longer exist and have been ignored.
  permission_view_project_workflow: View the project's workflow
  permission_manage_project_workflow: Manage the project's workflow
  label_project_workflow_project_scope: This project's workflow
  label_project_workflow_open_matrix: Open this workflow
  text_project_workflow_tab_description: One line per tracker and role this project can decide for. The number is how many rules the project holds itself; the label says whether those rules are what applies, or whether the generic workflow does.
  text_project_workflow_tab_nothing_to_configure: "There is nothing to configure here yet: this project has no tracker enabled, or no role with members that takes part in a workflow."
  text_project_workflow_project_enable_copy_confirm: Give this project its own workflow for this tracker and role, starting as a copy of the generic one?
  text_project_workflow_project_enable_empty_confirm: Give this project its own, empty workflow for this tracker and role? Nothing will be permitted until you add rules.
  text_project_workflow_readonly_generic: This project inherits the generic workflow for this tracker and role. It is shown below for reference; give the project its own workflow to change it.
  text_project_workflow_readonly_own: This is the project's own workflow. Changing it needs the permission to manage this project's workflow.
  notice_project_workflow_not_own: This project inherits the generic workflow for this tracker and role, so nothing was saved. Give the project its own workflow first.
  label_project_workflow_bulk_row: 'Set the whole row "%{name}" to %{value}'
  label_project_workflow_bulk_column: 'Set the whole column "%{name}" to %{value}'
  text_project_workflow_bulk_confirm: 'This action affects %{count} workflow rule(s). Continue?'
  text_project_workflow_bulk_selection: 'One cell of this matrix stands for %{count} workflow(s): %{trackers} tracker(s) × %{roles} role(s) × %{scopes} workflow scope(s).'
  text_project_workflow_bulk_legend: '"%{no_change}" means the workflows a cell stands for do not all say the same thing; saving leaves each of them as it is. A row or column action set to "%{no_change}" puts every cell in that row or column back to the value the page was opened with.'
  label_project_workflow_bulk_confirm_threshold: 'Ask before a row or column action changes more than'
  text_project_workflow_bulk_confirm_threshold: 'Number of workflow rules. A row or column action that would change more than this asks for confirmation first. 0 asks every time.'
