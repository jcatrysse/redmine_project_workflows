  text_project_workflow_tab_nothing_to_configure: "Er is hier nog niets in te stellen: dit project heeft geen tracker geactiveerd, of geen rol met leden die aan een workflow deelneemt."
  text_project_workflow_project_enable_copy_confirm: Dit project een eigen workflow geven voor deze tracker en rol, beginnend als een kopie van de algemene?
  text_project_workflow_project_enable_empty_confirm: Dit project een eigen, lege workflow geven voor deze tracker en rol? Er is niets toegestaan tot u regels toevoegt.
  text_project_workflow_readonly_generic: Dit project erft de algemene workflow voor deze tracker en rol. Hieronder staat die ter referentie; geef het project een eigen workflow om er iets aan te wijzigen.
  text_project_workflow_readonly_own: Dit is de eigen workflow van het project. Om hem te wijzigen hebt u het recht nodig om de workflow van dit project te beheren.
  notice_project_workflow_not_own: Dit project erft de algemene workflow voor deze tracker en rol, dus er is niets opgeslagen. Geef het project eerst een eigen workflow.
  label_project_workflow_bulk_row: 'Zet de hele rij "%{name}" op %{value}'
