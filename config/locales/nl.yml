    other: "%{count} volgen de algemene workflow"
  button_project_workflow_enable_copy: Eigen workflow geven (kopie van de algemene)
  button_project_workflow_enable_empty: Eigen lege workflow geven
  button_project_workflow_clear: Deze workflow leegmaken
  button_project_workflow_inherit: Terug naar de algemene workflow
  text_project_workflow_scope_help: Een eigen workflow vervangt de algemene; hij wordt er nooit aan toegevoegd. Een eigen lege workflow staat niets toe.
  text_project_workflow_enable_copy_confirm: Dit project een eigen workflow geven, als kopie van de algemene? Dit betreft %{count} combinatie(s) van project, tracker en rol.
  text_project_workflow_enable_empty_confirm: Dit project een eigen, lege workflow geven? Er is niets toegestaan tot u regels toevoegt. Dit betreft %{count} combinatie(s) van project, tracker en rol.
  text_project_workflow_clear_confirm: Alle regels uit deze workflow verwijderen? Het project houdt zijn eigen workflow, maar die staat niets toe.
  text_project_workflow_inherit_confirm: Terug naar de algemene workflow? De eigen regels van het project worden verwijderd.
  notice_project_workflow_enabled_copy:
    one: "%{count} workflow gekopieerd van de algemene."
    other: "%{count} workflows gekopieerd van de algemene."
  notice_project_workflow_enabled_empty:
    one: "%{count} eigen lege workflow aangemaakt."
    other: "%{count} eigen lege workflows aangemaakt."
  notice_project_workflow_inherited:
    one: "%{count} workflow teruggezet naar de algemene."
    other: "%{count} workflows teruggezet naar de algemene."
  notice_project_workflow_emptied:
    one: "%{count} workflow leeggemaakt."
    other: "%{count} workflows leeggemaakt."
  notice_project_workflow_scope_unchanged: Er hoefde niets gewijzigd te worden.
  label_project_workflow_inventory: Workflowoverzicht
  label_project_workflow_rule_type: Soort regel
  label_project_workflow_inventory_deviations_only: Alleen projecten met een eigen workflow
  text_project_workflow_inventory_description: "Eén regel per project, tracker en rol. Het getal is het aantal regels dat het project zelf heeft; het label zegt of die regels gelden, dan wel de algemene workflow."
  text_project_workflow_inventory_empty: Geen enkel project heeft een eigen workflow voor deze selectie.
  text_project_workflow_inventory_empty_filtered: Geen enkele combinatie van project, tracker en rol voldoet aan deze selectie.
  button_project_workflow_inventory_show_all: Toon elk project, elke tracker en elke rol
  button_project_workflow_inventory_open_matrices: Open de workflowmatrices
  error_project_workflow_inventory_filter: Een of meer filterwaarden bestaan niet meer en zijn genegeerd.
  permission_view_project_workflow: Workflow van het project bekijken
  permission_manage_project_workflow: Workflow van het project beheren
  label_project_workflow_project_scope: Workflow van dit project
  label_project_workflow_open_matrix: Deze workflow openen
  text_project_workflow_tab_description: Eén regel per tracker en rol waarover dit project kan beslissen. Het getal geeft aan hoeveel regels het project zelf heeft; het label zegt of die regels gelden of de algemene workflow.
  text_project_workflow_tab_nothing_to_configure: "Er is hier nog niets in te stellen: dit project heeft geen tracker geactiveerd, of geen rol met leden die aan een workflow deelneemt."
  text_project_workflow_project_enable_copy_confirm: Dit project een eigen workflow geven voor deze tracker en rol, beginnend als een kopie van de algemene?
  text_project_workflow_project_enable_empty_confirm: Dit project een eigen, lege workflow geven voor deze tracker en rol? Er is niets toegestaan tot u regels toevoegt.
  text_project_workflow_readonly_generic: "Dit project volgt de algemene workflow voor deze tracker en deze rol. Hieronder staat die ter referentie; geef het project een eigen workflow om er iets aan te wijzigen."
  text_project_workflow_readonly_own: Dit is de eigen workflow van het project. Om hem te wijzigen hebt u het recht nodig om de workflow van dit project te beheren.
  notice_project_workflow_not_own: "Dit project volgt de algemene workflow voor deze tracker en deze rol, dus er is niets opgeslagen. Geef het project eerst een eigen workflow."
  text_project_workflow_scope_inheriting_note:
    one: "%{count} combinatie in deze selectie volgt nog de algemene workflow. De matrix hieronder toont alleen de regels die de selectie zelf bewaart, dus die combinatie lijkt leeg, en opslaan verandert er niets aan — geef haar eerst een eigen workflow."
    other: "%{count} combinaties in deze selectie volgen nog de algemene workflow. De matrix hieronder toont alleen de regels die de selectie zelf bewaart, dus die combinaties lijken leeg, en opslaan verandert er niets aan — geef ze eerst een eigen workflow."
  notice_project_workflow_save_skipped_inheriting:
    one: "%{count} combinatie van project, tracker en rol volgt nog de algemene workflow en is niet gewijzigd. Geef haar eerst een eigen workflow."
    other: "%{count} combinaties van project, tracker en rol volgen nog de algemene workflow en zijn niet gewijzigd. Geef ze eerst een eigen workflow."
  label_project_workflow_bulk_row: 'Zet de hele rij "%{name}" op %{value}'
  label_project_workflow_bulk_column: 'Zet de hele kolom "%{name}" op %{value}'
  text_project_workflow_bulk_confirm: 'Deze actie raakt %{count} workflowregel(s). Doorgaan?'
  text_project_workflow_bulk_selection: 'Eén cel van deze matrix staat voor %{count} workflow(s): %{trackers} tracker(s) × %{roles} rol(len) × %{scopes} workflowbereik(en).'
  text_project_workflow_bulk_legend: '"%{no_change}" betekent dat de workflows waarvoor een cel staat niet allemaal hetzelfde zeggen; bij opslaan blijft elk ervan zoals het is.'
  text_project_workflow_bulk_legend_actions: 'Een rij- of kolomactie op "%{no_change}" zet elke cel in die rij of kolom terug naar de waarde waarmee de pagina is geopend.'
  label_project_workflow_bulk_confirm_threshold: 'Vraag bevestiging wanneer een rij- of kolomactie meer wijzigt dan'
  text_project_workflow_bulk_confirm_threshold: 'Aantal workflowregels. Een rij- of kolomactie die meer dan dit zou wijzigen, vraagt eerst om bevestiging. 0 vraagt altijd.'
  label_project_workflow_compare: Vergelijken met de algemene workflow
  label_project_workflow_compare_difference: Verschil
  label_project_workflow_compare_project_only: Alleen in dit project
  label_project_workflow_compare_generic_only: Alleen in de algemene workflow
  label_project_workflow_compare_changed: Verschillend
  label_project_workflow_compare_condition: Geldt voor
  label_project_workflow_compare_in_project: In dit project
  label_project_workflow_compare_in_generic: In de algemene workflow
  label_project_workflow_condition_always: Iedereen met deze rol
  label_project_workflow_condition_author: Ook wanneer de gebruiker de auteur is
  label_project_workflow_condition_assignee: Ook wanneer de gebruiker de toegewezen persoon is
  text_project_workflow_compare_description: De workflow van dit project vervangt de algemene workflow voor deze tracker en deze rol; wat hieronder staat is dus het volledige verschil. Er wordt niets samengevoegd en er geldt niets meer uit de algemene workflow.
  text_project_workflow_compare_counts: Dit project heeft %{project} eigen regel(s) voor deze tracker en deze rol; de algemene workflow heeft %{generic}.
  text_project_workflow_compare_identical: De eigen workflow van dit project is identiek aan de algemene workflow voor deze tracker en deze rol.
  text_project_workflow_compare_inherits: "Dit project volgt de algemene workflow voor deze tracker en deze rol, dus er is niets te vergelijken."
  button_project_workflow_bulk_undo: Ongedaan maken
  text_project_workflow_bulk_changed: '%{cells} cel(len) gewijzigd, %{rules} workflowregel(s).'
  text_project_workflow_bulk_undone: 'Ongedaan gemaakt: %{cells} cel(len) teruggezet.'
  text_project_workflow_bulk_unsaved: Er is nog niets opgeslagen. Druk op Opslaan om deze wijzigingen door te voeren.
  label_project_workflow_comparison: Workflowvergelijking
  text_project_workflow_compare_unreachable_field: Minstens één verschil hieronder betreft een veld dat deze tracker niet meer aanbiedt; de eigen matrix van het project kan het dus niet tonen of wijzigen. Een systeembeheerder kan zo'n regel via Beheer verwijderen.
  label_project_workflow_map: Workflow voor dit issue
  label_project_workflow_map_scope: Welke workflow geldt
  label_project_workflow_map_from_here: Statuswijzigingen die hier zijn toegestaan
  label_project_workflow_map_leads_here: Statussen die naar deze leiden
  label_project_workflow_map_available: Nu beschikbaar
  text_project_workflow_map_authority: Dit is wat de workflow toestaat. De statuslijst op het formulier blijft bepalen wat u op dit moment mag doen; elk verschil tussen de twee wordt hieronder uitgelegd.
  text_project_workflow_map_no_outgoing: Deze workflow staat vanaf hier geen enkele statuswijziging toe.
  text_project_workflow_map_no_incoming: Deze workflow staat geen enkele statuswijziging naar deze status toe.
  text_project_workflow_map_no_roles: U hebt in dit project geen rol die aan een workflow deelneemt, dus is er geen statuswijziging toegestaan.
  text_project_workflow_map_own_empty: Dit project heeft een eigen workflow voor deze tracker en rol, en die bevat geen enkele regel, dus is er geen statuswijziging toegestaan. Dat is een bewuste keuze en geen fout.
  text_project_workflow_map_requires_author: Alleen de auteur van het issue mag deze wijziging maken.
  text_project_workflow_map_requires_assignee: Alleen de toegewezen persoon mag deze wijziging maken.
  text_project_workflow_map_requires_author_or_assignee: Alleen de auteur of de toegewezen persoon mag deze wijziging maken.
  text_project_workflow_map_unavailable: Momenteel niet beschikbaar voor dit issue.
  label_project_workflow_map_condition_author: Alleen wanneer de gebruiker de auteur is
  label_project_workflow_map_condition_assignee: Alleen wanneer de gebruiker de toegewezen persoon is
  label_project_workflow_map_condition_author_or_assignee: Alleen wanneer de gebruiker de auteur of de toegewezen persoon is
