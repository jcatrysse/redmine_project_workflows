# Offences this plugin does not intend to fix, and why.
#
# Regenerated with
# `rubocop --auto-gen-config --auto-gen-only-exclude --exclude-limit 200 --no-auto-gen-timestamp`
# and then annotated by hand. The annotations are the point: a generated list
# says which cop is off in which file and nothing about whether that is debt or
# a decision, and this file is almost entirely decisions.
#
# WP7 took it from 198 offences across 21 files to 48 across 8 -- 50 at first, and
# two fewer after the review found the `Layout/LineLength` entry excusing one line
# the autocorrect had itself created and another in a method of the plugin's own. What went was
# mechanical -- quote style, indentation, dot position, blank lines, heredocs,
# `map.compact`, `unless present?`, `== 0`, a negated `include?`, an inverted
# `==`. What is left falls into three groups:
#
# 1. **The patch files whose method bodies are Redmine's own.** `issue_patch.rb`,
#    `workflow_rule_patch.rb` and `project_workflow_matrix_helper.rb` reimplement
#    core methods with one or two project-blind queries replaced (see
#    `docs/design.md`, "Integration points in Redmine core"). Their shape is
#    core's shape, and that is the property that makes them auditable: you can
#    diff them against a real checkout and see exactly what the plugin changed.
#    Refactoring them to satisfy a size or complexity metric would destroy that
#    and buy nothing -- the complexity is Redmine's, and the plugin does not own
#    it. This accounts for every `Metrics/*` entry below.
#
#    Two files left this group in WP12. `workflows_helper_patch.rb` was deleted
#    by ADR-003, and `workflows_controller_patch.rb` shrank from 468 lines to
#    four narrowed queries and stopped offending against any `Metrics/*` cop --
#    which is what a decision to reduce the core-modification surface looks like
#    from the lint gate.
# 2. **`insert_all` and `update_all` in the writers.** Deliberate, and an
#    invariant rather than a shortcut: INV-2 says every write goes through
#    `TransitionWriter` / `PermissionWriter`, which whitelist `rule`, `field_name`
#    and status ids against server-built lists, *because* `insert_all` runs no
#    validations. The writer is the validation. New code says so with an inline
#    `rubocop:disable Rails/SkipsModelValidations` and a comment; these three
#    files predate that convention and are excluded wholesale.
# 3. **Three single offences where the cop's fix would be wrong.** Each is
#    annotated at its own entry.
#
# Anything added here from now on needs a sentence saying which of the three it
# is. If it is none of them, it is debt, and it should be fixed instead.

# Offense count: 2
# This cop supports safe autocorrection (--autocorrect).
# Configuration parameters: Max, AllowHeredoc, AllowURI, AllowQualifiedName, URISchemes, AllowRBSInlineAnnotation, AllowCopDirectives, AllowedPatterns, SplitStrings.
# URISchemes: http, https
# Group 1. Core's own `if new_record? / elsif tracker_id_changed? / else` chain,
# in which two branches genuinely assign the same thing for different reasons.
Lint/DuplicateBranch:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'

# Offense count: 1
# This cop supports unsafe autocorrection (--autocorrect-all).
# Group 3. Dir.glob has been sorted since Ruby 3.0, so the cop is right that the
# call is redundant. It stays because a deterministic load order for the Deface
# overrides is worth stating rather than inheriting from a Ruby version, and the
# call costs nothing. It is *not* currently load-bearing -- the WP7 review checked
# that no two overrides share a (virtual_path, selector) pair, so no rendered page
# depends on the order today, and no spec asserts one. A future pair that did
# would make this a real requirement.
Lint/RedundantDirGlobSort:
  Exclude:
    - 'lib/redmine_project_workflows.rb'

# Offense count: 12
# Configuration parameters: AllowedMethods, AllowedPatterns, CountRepeatedAttributes, Max.
# Group 1. `project_workflow_matrix_helper.rb` joined the list in WP12 without
# gaining an offence: `field_permission_tag` is core's own body and was excluded
# under `workflows_helper_patch.rb` until ADR-003 moved it to a helper of the
# plugin's own. The file changed, the reason did not -- the complexity is
# Redmine's, and diffing the copy against a real checkout is what makes it
# auditable.
Metrics/AbcSize:
  Exclude:
    - 'app/helpers/project_workflow_matrix_helper.rb'
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'
    - 'lib/redmine_project_workflows/services/transition_query.rb'

# Offense count: 7
# Configuration parameters: AllowedMethods, AllowedPatterns, Max.
# Group 1.
Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'
    - 'lib/redmine_project_workflows/services/transition_query.rb'

# Offense count: 6
# Configuration parameters: CountComments, Max, CountAsOne, AllowedMethods, AllowedPatterns.
# Group 1.
Metrics/MethodLength:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'
    - 'lib/redmine_project_workflows/services/transition_query.rb'

# Offense count: 2
# Configuration parameters: Max, CountKeywordArgs, MaxOptionalParameters.
# Group 1. Both mirror core's own `WorkflowRule.copy` / `.copy_one` signatures
# with the two project ids added, and staying parallel to core is what makes the
# pair readable side by side. (`TransitionWriter.transition_row` was the third
# entry here and is now keyword arguments: its last two positional parameters
# were booleans, which is the shape this cop exists to catch.)
Metrics/ParameterLists:
  Exclude:
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'

# Offense count: 10
# Configuration parameters: AllowedMethods, AllowedPatterns, Max.
# Group 1. See Metrics/AbcSize for why the helper is here.
Metrics/PerceivedComplexity:
  Exclude:
    - 'app/helpers/project_workflow_matrix_helper.rb'
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'
    - 'lib/redmine_project_workflows/services/transition_query.rb'

# Offense count: 2
# This cop supports unsafe autocorrection (--autocorrect-all).
# Configuration parameters: EnforcedStyleForLeadingUnderscores.
# SupportedStylesForLeadingUnderscores: disallowed, required, optional
# Group 3. `find_statuses` memoises into @statuses because @statuses is what the
# workflow views read. Renaming it to @find_statuses to satisfy the cop would
# leave the matrix with no statuses at all. Two files since WP12: the patch on
# core's own controller still narrows the query to the generic workflow, and the
# plugin's own administration controller has its own copy.
Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/controllers/project_workflow_rules_controller.rb'
    - 'lib/redmine_project_workflows/patches/workflows_controller_patch.rb'

# Offense count: 2
# Configuration parameters: Mode, AllowedMethods, AllowedPatterns, AllowBangMethods, WaywardPredicates.
# AllowedMethods: call
# WaywardPredicates: infinite?, nonzero?
# Group 1. Commands, not questions -- `copy_one_for_project` and
# `copy_one_with_projects` are named after core's `copy_one`. The cop is reading
# the last expression of the body, not an intent to return a boolean, and adding
# a `?` would say these methods answer something rather than do something.
Naming/PredicateMethod:
  Exclude:
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'

# Offense count: 1
# This cop supports unsafe autocorrection (--autocorrect-all).
# Configuration parameters: Whitelist, AllowedMethods, AllowedReceivers.
# Whitelist: find_by_sql, find_by_token_for
# AllowedMethods: find_by_sql, find_by_token_for
# AllowedReceivers: Gem::Specification, page
# Group 1. `IssueStatus.find_by_id` is core's own call, inside the copied body of
# Issue#new_statuses_allowed_to.
Rails/DynamicFindBy:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'

# Offense count: 5
# Configuration parameters: ForbiddenMethods, AllowedMethods.
# ForbiddenMethods: decrement!, decrement_counter, increment!, increment_counter, insert, insert!, insert_all, insert_all!, toggle!, touch, touch_all, update_all, update_attribute, update_column, update_columns, update_counters, upsert, upsert_all
# Two groups in one entry, because a cop cannot be listed twice. The WP7 review
# caught this filed wholesale under group 2, which was wrong for the first file:
# `workflow_rule_patch.rb` is not a writer, and INV-2 says nothing about it.
Rails/SkipsModelValidations:
  Exclude:
    # Group 1. Three raw `connection.insert("INSERT ... SELECT ...")` statements,
    # mirroring core's own WorkflowRule.copy_one, which does the same. Every value
    # they write is a column of a row already in the table or an id resolved from
    # the database, so no request parameter reaches one -- which is why there is no
    # whitelist here and why INV-2, which is about parameters, does not apply.
    - 'lib/redmine_project_workflows/patches/workflow_rule_patch.rb'
    # Group 2. The two writers, where `insert_all` is the point: it runs no
    # validations, which is why INV-2 makes the writer the validation.
    - 'lib/redmine_project_workflows/services/permission_writer.rb'
    - 'lib/redmine_project_workflows/services/transition_writer.rb'

# Offense count: 1
# Configuration parameters: AllowedMethods.
# AllowedMethods: respond_to_missing?
# Group 1. `new_statuses_allowed_to(user = User.current, include_default = false)`
# is core's signature. Changing it would break every caller in Redmine.
Style/OptionalBooleanParameter:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'
