# WaywardPredicates: infinite?, nonzero?
# Group 1. Commands, not questions -- `copy_one_for_project` and
# `copy_one_with_projects` are named after core's `copy_one`. The cop is reading
# the last expression of the body, not an intent to return a boolean, and adding
# a `?` would say these methods answer something rather than do something.
Naming/PredicateMethod:
