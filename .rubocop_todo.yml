# Offences this plugin does not intend to fix, and why.
#
# Regenerated with
# `rubocop --auto-gen-config --auto-gen-only-exclude --exclude-limit 200 --no-auto-gen-timestamp`
# and then annotated by hand. The annotations are the point: a generated list
# says which cop is off in which file and nothing about whether that is debt or
# a decision, and this file is almost entirely decisions.
#
# WP7 took it from 198 offences across 21 files to 50 across 8. What went was
# mechanical -- quote style, indentation, dot position, blank lines, heredocs,
# `map.compact`, `unless present?`, `== 0`, a negated `include?`, an inverted
# `==`. What is left falls into three groups:
#
# 1. **The four patch files whose method bodies are Redmine's own.**
#    `issue_patch.rb`, `workflows_controller_patch.rb`, `workflows_helper_patch.rb`
#    and `workflow_rule_patch.rb` reimplement core methods with one or two
#    project-blind queries replaced (see `docs/design.md`, "Integration points in
#    Redmine core"). Their shape is core's shape, and that is the property that
#    makes them auditable: you can diff them against a real checkout and see
#    exactly what the plugin changed. Refactoring them to satisfy a size or
#    complexity metric would destroy that and buy nothing -- the complexity is
#    Redmine's, and the plugin does not own it. This accounts for every
#    `Metrics/*` entry below.
# 2. **`insert_all` and `update_all` in the writers.** Deliberate, and an
#    invariant rather than a shortcut: INV-2 says every write goes through
#    `TransitionWriter` / `PermissionWriter`, which whitelist `rule`, `field_name`
#    and status ids against server-built lists, *because* `insert_all` runs no
#    validations. The writer is the validation. New code says so with an inline
#    `rubocop:disable Rails/SkipsModelValidations` and a comment; these three
#    files predate that convention and are excluded wholesale.
# 3. **Three single offences where the cop's fix would be wrong.** Each is
#    annotated at its own entry.
#
# Anything added here from now on needs a sentence saying which of the three it
# is. If it is none of them, it is debt, and it should be fixed instead.

# Offense count: 2
# This cop supports safe autocorrection (--autocorrect).
# Configuration parameters: Max, AllowHeredoc, AllowURI, AllowQualifiedName, URISchemes, AllowRBSInlineAnnotation, AllowCopDirectives, AllowedPatterns, SplitStrings.
# URISchemes: http, https
# Group 1. Both are inside Issue#new_statuses_allowed_to, whose body is core's
# byte-identical in 5.1, 6.1 and 7.0. Rewrapping them makes the diff against a
# real checkout noisier for no reader's benefit.
Layout/LineLength:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'

# Offense count: 2
# Configuration parameters: IgnoreLiteralBranches, IgnoreConstantBranches, IgnoreDuplicateElseBranch.
# Group 1. Core's own `if new_record? / elsif tracker_id_changed? / else` chain,
# in which two branches genuinely assign the same thing for different reasons.
Lint/DuplicateBranch:
  Exclude:
    - 'lib/redmine_project_workflows/patches/issue_patch.rb'

# Offense count: 1
# This cop supports unsafe autocorrection (--autocorrect-all).
# Group 3. Dir.glob has been sorted since Ruby 3.0, so the cop is right that the
# call is redundant -- but the Deface overrides have to load in a stable order
# and the explicit sort is what says so. Keeping a redundant call that states an
# intent is cheaper than a comment nothing enforces.
Lint/RedundantDirGlobSort:
  Exclude:
    - 'lib/redmine_project_workflows.rb'

